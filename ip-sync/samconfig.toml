version = 0.1

[default]
[default.global.parameters]
stack_name = "amrd-ip-sync"

[default.build.parameters]
cached   = true
parallel = true

[default.deploy.parameters]
capabilities      = "CAPABILITY_IAM"
confirm_changeset = false
resolve_s3        = true
s3_prefix         = "amrd-ip-sync"
region            = "us-east-1"
fail_on_empty_changeset = false
# DryRun=true is the template default: the Lambda only logs its plan until this is set to "false".
