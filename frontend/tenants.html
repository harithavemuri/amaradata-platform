<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
  <title>Tenants — AmaraData Platform</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="/js/platform.js"></script>
</head>
<body>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
        const root = window.__amrd.renderSidebar('Tenants');

        const fmtDate = d => {
            if (!d && d !== 0) return '—';
            const asNum = typeof d === 'number' ? d : (/^\d{9,12}$/.test(String(d)) ? Number(d) : NaN);
            const date = isNaN(asNum) ? new Date(d) : new Date(asNum * 1000);
            return isNaN(date.getTime()) ? '—' : date.toLocaleDateString('en-US', { month: 'short', day: '2-digit', year: 'numeric' });
        };

        const PAGE_SIZE = 20;
        let _allTenants = [];
        let _filtered   = [];
        let _page       = 1;
        let _search     = { name: '', email: '', status: '' };

        function applySearch() {
            const name  = _search.name.trim().toLowerCase();
            const email = _search.email.trim().toLowerCase();
            _filtered = _allTenants.filter(t =>
                (!name  || t.name.toLowerCase().includes(name)) &&
                (!email || (t.contact_email || '').toLowerCase().includes(email)) &&
                (!_search.status || t.status === _search.status)
            );
            _page = 1;
            renderTable();
        }

        function resetSearch() {
            _search = { name: '', email: '', status: '' };
            document.getElementById('sf-name').value = '';
            document.getElementById('sf-email').value = '';
            document.getElementById('sf-status').value = '';
            applySearch();
        }

        function renderTable() {
            const tbody = document.getElementById('tenants-tbody');
            const pageRows = window.__amrd.paginate(_filtered, _page, PAGE_SIZE);
            tbody.innerHTML = pageRows.map(t => `
                <tr>
                    <td><strong>${t.name}</strong><br><span style="color:#94a3b8;font-size:11px">${t.slug}</span></td>
                    <td>${t.contact_name || '—'}<br><span style="color:#64748b;font-size:11px">${t.contact_email || ''}</span></td>
                    <td>${t.contact_phone || '—'}</td>
                    <td><span class="amrd-badge amrd-badge-${t.status}">${t.status}</span></td>
                    <td>${fmtDate(t.onboarded_at)}</td>
                    <td>${t.site_url ? `<a href="${t.site_url}" target="_blank" rel="noopener" style="color:#008cbb;font-size:12px;font-weight:600;text-decoration:none;display:inline-flex;align-items:center;gap:4px">Open ↗</a>` : '<span style="color:#94a3b8">—</span>'}</td>
                    <td>${window.__amrd.getStaff()?.role === 'super_admin' && t.site_url ? `<button class="amrd-btn amrd-btn-ghost amrd-btn-sm" onclick="openModules(${t.id})">Modules</button>` : '<span style="color:#94a3b8">—</span>'}</td>
                    <td><button class="amrd-btn amrd-btn-ghost amrd-btn-sm" onclick='openForm(${JSON.stringify(t)})'>${window.__amrd.isReadOnly() ? 'View' : 'Edit'}</button></td>
                </tr>`).join('') || `<tr><td colspan="8" style="color:#94a3b8;text-align:center;padding:24px">No tenants${_allTenants.length ? ' match your search' : ' yet'}</td></tr>`;
            document.getElementById('tenants-count').textContent = `${_filtered.length} tenant(s)`;
            window.__amrd.renderPagination(document.getElementById('tenants-pagination'), {
                page: _page, pageSize: PAGE_SIZE, total: _filtered.length,
                onChange: (p) => { _page = p; renderTable(); },
            });
        }

        function exportTenants() {
            window.__amrd.exportCsv('tenants.csv', _filtered, [
                { key: 'name',           label: 'Name' },
                { key: 'slug',           label: 'Slug' },
                { key: 'contact_name',   label: 'Contact Name' },
                { key: 'contact_email',  label: 'Contact Email' },
                { key: 'contact_phone',  label: 'Phone' },
                { key: 'status',         label: 'Status' },
                { key: 'onboarded_at',   label: 'Onboarded' },
                { key: 'site_url',       label: 'Site URL' },
            ]);
        }

        async function load() {
            const gql = await window.__amrd.gqlFetch(
                `{ tenants { id name slug contact_name contact_email contact_phone status onboarded_at site_url } }`
            );
            _allTenants = gql?.tenants || [];
            _filtered   = _allTenants;

            root.innerHTML = `
                <div class="amrd-card">
                    <div class="amrd-search-bar">
                        <div class="amrd-search-field"><label>Name</label><input id="sf-name" placeholder="Search by name…"></div>
                        <div class="amrd-search-field"><label>Contact Email</label><input id="sf-email" placeholder="Search by email…"></div>
                        <div class="amrd-search-field">
                            <label>Status</label>
                            <select id="sf-status">
                                <option value="">All</option>
                                <option value="active">active</option>
                                <option value="suspended">suspended</option>
                                <option value="churned">churned</option>
                            </select>
                        </div>
                        <div class="amrd-search-actions">
                            <button class="amrd-btn amrd-btn-primary" id="btn-search">Search</button>
                            <button class="amrd-btn amrd-btn-ghost" id="btn-reset">Reset</button>
                        </div>
                    </div>
                </div>
                <div class="amrd-toolbar">
                    <span id="tenants-count" style="color:#64748b;font-size:13px"></span>
                    <div style="display:flex;gap:8px">
                        <button class="amrd-btn amrd-btn-ghost" id="btn-export">⬇ Export CSV</button>
                        ${window.__amrd.isReadOnly() ? '' : '<button class="amrd-btn amrd-btn-primary" onclick="openForm()">+ Add Tenant</button>'}
                    </div>
                </div>
                <div class="amrd-card" style="padding:0">
                    <div class="amrd-table-wrap">
                    <table class="amrd-table">
                        <thead><tr><th>Name</th><th>Contact</th><th>Phone</th><th>Status</th><th>Onboarded</th><th>Site</th><th>Modules</th><th></th></tr></thead>
                        <tbody id="tenants-tbody"></tbody>
                    </table>
                    </div>
                    <div id="tenants-pagination"></div>
                </div>
                <div id="form-slot"></div>
                <div id="modules-modal-slot"></div>`;

            document.getElementById('btn-search').addEventListener('click', () => {
                _search = {
                    name:   document.getElementById('sf-name').value,
                    email:  document.getElementById('sf-email').value,
                    status: document.getElementById('sf-status').value,
                };
                applySearch();
            });
            document.getElementById('btn-reset').addEventListener('click', resetSearch);
            document.getElementById('btn-export').addEventListener('click', exportTenants);
            // Enter key in a search field triggers Search, matching the button.
            ['sf-name', 'sf-email'].forEach(id =>
                document.getElementById(id).addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('btn-search').click(); })
            );

            renderTable();
        }

        function openForm(t = null) {
            if (!t && window.__amrd.isReadOnly()) return;
            const ro  = window.__amrd.isReadOnly();
            const dis = ro ? ' disabled' : '';
            const slot = document.getElementById('form-slot');
            slot.innerHTML = `
                <div class="amrd-card">
                    <h3>${ro ? 'View Tenant' : (t ? 'Edit Tenant' : 'New Tenant')}</h3>
                    <div class="amrd-form-row">
                        <div><label>Name *</label><input id="f-name" value="${t?.name||''}"${dis}></div>
                        <div><label>Slug *</label><input id="f-slug" value="${t?.slug||''}"${dis}></div>
                    </div>
                    <div class="amrd-form-row">
                        <div><label>Contact Name</label><input id="f-cname" value="${t?.contact_name||''}"${dis}></div>
                        <div><label>Contact Email</label><input id="f-cemail" type="email" value="${t?.contact_email||''}"${dis}></div>
                    </div>
                    <div class="amrd-form-row">
                        <div><label>Phone</label><input id="f-phone" value="${t?.contact_phone||''}"${dis}></div>
                        <div><label>Status</label>
                            <select id="f-status"${dis}>
                                ${['active','suspended','churned'].map(s=>`<option value="${s}"${t?.status===s?' selected':''}>${s}</option>`).join('')}
                            </select>
                        </div>
                    </div>
                    <div class="amrd-form-row">
                        <div><label>Tax ID</label><input id="f-gstin" value="${t?.gstin||''}"${dis}></div>
                        <div><label>National ID</label><input id="f-pan" value="${t?.pan||''}"${dis}></div>
                    </div>
                    <div class="amrd-form-row">
                        <div><label>Onboarded Date</label><input id="f-onboard" type="date" value="${t?.onboarded_at?.slice(0,10)||''}"${dis}></div>
                        <div><label>Site URL</label><input id="f-siteurl" type="url" placeholder="https://..." value="${t?.site_url||''}"${dis}></div>
                    </div>
                    <div class="amrd-form-row full"><div><label>Billing Address</label><textarea id="f-addr" rows="2"${dis}>${t?.billing_address||''}</textarea></div></div>
                    <div style="margin-top:16px;display:flex;gap:10px">
                        ${ro
                            ? '<button class="amrd-btn amrd-btn-ghost" onclick="document.getElementById(\'form-slot\').innerHTML=\'\'">Close</button>'
                            : `<button class="amrd-btn amrd-btn-primary" onclick="save(${t?.id||'null'})">Save</button>
                               <button class="amrd-btn amrd-btn-ghost" onclick="document.getElementById('form-slot').innerHTML=''">Cancel</button>`
                        }
                    </div>
                    <div id="save-err" style="color:#dc2626;font-size:13px;margin-top:8px"></div>
                </div>`;
            slot.scrollIntoView({ behavior: 'smooth' });
        }

        async function save(id) {
            const body = {
                name:            document.getElementById('f-name').value,
                slug:            document.getElementById('f-slug').value,
                contact_name:    document.getElementById('f-cname').value,
                contact_email:   document.getElementById('f-cemail').value,
                contact_phone:   document.getElementById('f-phone').value,
                status:          document.getElementById('f-status').value,
                gstin:           document.getElementById('f-gstin').value,
                pan:             document.getElementById('f-pan').value,
                billing_address: document.getElementById('f-addr').value,
                onboarded_at:    document.getElementById('f-onboard').value || null,
                site_url:        document.getElementById('f-siteurl').value || null,
            };
            try {
                if (id) {
                    await window.__amrd.apiFetch(`/api/tenants/${id}`, { method: 'PUT', body: JSON.stringify(body) });
                } else {
                    await window.__amrd.apiFetch('/api/tenants', { method: 'POST', body: JSON.stringify(body) });
                }
                await load();
            } catch (e) {
                document.getElementById('save-err').textContent = e.message;
            }
        }

        const MODULE_LABELS = { sales_management: 'Sales Management', rental_management: 'Rental Management' };

        async function openModules(tenantId) {
            const tenant = _allTenants.find(t => t.id == tenantId);
            const slot = document.getElementById('modules-modal-slot');
            slot.innerHTML = `
                <div id="modulesModal" style="display:flex;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:1000;align-items:center;justify-content:center">
                    <div style="background:#fff;border-radius:12px;padding:28px;width:100%;max-width:480px;max-height:80vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)">
                        <h3 style="margin:0 0 4px;font-size:16px;color:#0f172a">Modules — ${tenant?.name || ''}</h3>
                        <p style="margin:0 0 16px;font-size:12px;color:#94a3b8">Toggling here updates the tenant's own site live via SSO.</p>
                        <div id="modules-err" style="color:#dc2626;font-size:13px;margin-bottom:10px"></div>
                        <div id="modules-body">Loading…</div>
                        <div style="display:flex;justify-content:flex-end;margin-top:16px">
                            <button class="amrd-btn amrd-btn-ghost" onclick="closeModules()">Close</button>
                        </div>
                    </div>
                </div>`;

            try {
                const res = await window.__amrd.apiFetch(`/api/tenants/${tenantId}/modules`);
                renderModulesBody(tenantId, res.data || []);
            } catch (e) {
                document.getElementById('modules-body').innerHTML = '';
                document.getElementById('modules-err').textContent = e.message;
            }
        }

        function renderModulesBody(tenantId, rows) {
            const body = document.getElementById('modules-body');
            if (!rows.length) {
                body.innerHTML = '<p style="color:#94a3b8;font-size:13px">No projects found on the tenant site.</p>';
                return;
            }
            const byProject = {};
            rows.forEach(r => {
                if (!byProject[r.project_id]) byProject[r.project_id] = { name: r.project_name || `Project ${r.project_id}`, modules: {} };
                byProject[r.project_id].modules[r.module] = r.enabled;
            });
            body.innerHTML = Object.entries(byProject).map(([projectId, p]) => `
                <div style="margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid #f1f5f9">
                    <div style="font-weight:600;font-size:13px;color:#334155;margin-bottom:8px">${p.name}</div>
                    ${Object.keys(MODULE_LABELS).map(m => `
                        <label style="display:flex;align-items:center;gap:8px;font-size:13px;color:#475569;padding:4px 0;cursor:pointer">
                            <input type="checkbox" ${p.modules[m] ? 'checked' : ''}
                                onchange="toggleModule(${tenantId}, ${projectId}, '${m}', this.checked, this)">
                            ${MODULE_LABELS[m]}
                        </label>`).join('')}
                </div>`).join('');
        }

        async function toggleModule(tenantId, projectId, moduleName, enabled, checkbox) {
            checkbox.disabled = true;
            document.getElementById('modules-err').textContent = '';
            try {
                await window.__amrd.apiFetch(`/api/tenants/${tenantId}/modules`, {
                    method: 'PUT', body: JSON.stringify({ project_id: projectId, module: moduleName, enabled }),
                });
            } catch (e) {
                checkbox.checked = !enabled;
                document.getElementById('modules-err').textContent = e.message;
            } finally {
                checkbox.disabled = false;
            }
        }

        function closeModules() {
            document.getElementById('modules-modal-slot').innerHTML = '';
        }

        window.openForm    = openForm;
        window.save        = save;
        window.openModules = openModules;
        window.toggleModule = toggleModule;
        window.closeModules = closeModules;
        await load();
    });
  </script>
</body>
</html>
