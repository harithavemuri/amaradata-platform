<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
  <title>Roles — AmaraData Platform</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="/js/platform.js"></script>
</head>
<body>
<script>
document.addEventListener('DOMContentLoaded', async () => {
    const root = window.__amrd.renderSidebar('Roles');

    let roles = [];
    let editId = null;
    let viewRoleId = null;

    let _filtered = [];
    let _page = 1;
    const PAGE_SIZE = 20;
    let _search = { q: '', type: '' };

    const columns = [
        { key: 'name',        label: 'Name' },
        { key: 'label',       label: 'Label' },
        { key: 'description', label: 'Description' },
        { key: 'user_count',  label: 'Direct Users' },
        { key: 'group_count', label: 'Groups' },
        { key: 'type_label',  label: 'Type' },
    ];

    async function fetchAll() {
        const res = await window.__amrd.apiFetch('/api/admin/roles');
        roles = res.data || [];
    }

    async function refresh() {
        await fetchAll();
        applySearch();
        if (viewRoleId) usersPanel(true, viewRoleId);
    }

    // ── role modal ────────────────────────────────────────────────────────────
    function roleModal(show, role = {}) {
        editId = role.id || null;
        document.getElementById('rmTitle').textContent  = editId ? 'Edit Role' : 'New Role';
        document.getElementById('rmName').value         = role.name  || '';
        document.getElementById('rmName').disabled      = !!editId;
        document.getElementById('rmLabel').value        = role.label || '';
        document.getElementById('rmDesc').value         = role.description || '';
        document.getElementById('rmErr').textContent    = '';
        document.getElementById('roleModal').style.display = show ? 'flex' : 'none';
    }

    async function saveRole() {
        const name  = document.getElementById('rmName').value.trim().toLowerCase().replace(/\s+/g,'_');
        const label = document.getElementById('rmLabel').value.trim();
        const description = document.getElementById('rmDesc').value.trim();
        const errEl = document.getElementById('rmErr');
        if (!label || (!editId && !name)) { errEl.textContent = 'Name and label are required'; return; }

        try {
            if (editId) {
                await window.__amrd.apiFetch(`/api/admin/roles/${editId}`, {
                    method:'PUT', body: JSON.stringify({ label, description }),
                });
            } else {
                await window.__amrd.apiFetch('/api/admin/roles', {
                    method:'POST', body: JSON.stringify({ name, label, description }),
                });
            }
            roleModal(false);
            await refresh();
        } catch (e) { errEl.textContent = e.message; }
    }

    async function deleteRole(id) {
        const role = roles.find(r => r.id == id);
        if (!role) return;
        if (role.is_system) { alert('System roles cannot be deleted.'); return; }
        const totalUsers  = (role.user_count || 0);
        const totalGroups = (role.groups || []).length;
        if (totalUsers > 0 || totalGroups > 0) {
            const who = [];
            if (totalUsers  > 0) who.push(`${totalUsers} user${totalUsers>1?'s':''}`);
            if (totalGroups > 0) who.push(`${totalGroups} group${totalGroups>1?'s':''}`);
            alert(`Cannot delete — ${who.join(' and ')} use this role. Reassign them first.`);
            return;
        }
        if (!confirm(`Delete the "${role.label}" role?`)) return;
        try {
            await window.__amrd.apiFetch(`/api/admin/roles/${id}`, { method:'DELETE' });
            if (viewRoleId == id) usersPanel(false);
            await refresh();
        } catch (e) { alert(e.message); }
    }

    // ── detail panel ──────────────────────────────────────────────────────────
    function usersPanel(show, roleId) {
        viewRoleId = roleId || null;
        if (!show) { document.getElementById('usersPanel').style.display = 'none'; return; }
        const role = roles.find(r => r.id == roleId);
        document.getElementById('usersPanelTitle').textContent = `${role?.label || ''} — Members`;
        document.getElementById('usersPanel').style.display = 'flex';
        renderPanelContent(role);
    }

    function renderPanelContent(role) {
        const fmt = d => d ? new Date(d).toLocaleDateString() : '—';
        const directUsers = role?.users  || [];
        const groups      = role?.groups || [];

        const userItems = directUsers.length
            ? directUsers.map(u => `
                <div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #f1f5f9">
                    <div style="width:30px;height:30px;border-radius:50%;background:#e0f2fe;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;color:#0284c7;flex-shrink:0">
                        ${u.name.charAt(0).toUpperCase()}
                    </div>
                    <div style="flex:1;min-width:0">
                        <div style="font-weight:600;font-size:13px;color:${u.is_active?'#0f172a':'#94a3b8'}">${u.name}</div>
                        <div style="font-size:11px;color:#64748b;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${u.email}</div>
                    </div>
                    <span class="amrd-badge ${u.is_active ? 'amrd-badge-active' : 'amrd-badge-cancelled'}" style="flex-shrink:0">${u.is_active ? 'Active' : 'Inactive'}</span>
                </div>`).join('')
            : '<p style="color:#94a3b8;font-size:13px;margin:8px 0">No direct users.</p>';

        const groupItems = groups.length
            ? groups.map(g => `
                <div style="display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid #f1f5f9">
                    <div>
                        <div style="font-weight:600;font-size:13px;color:#0f172a">${g.name}</div>
                        <div style="font-size:11px;color:#64748b">${g.member_count} member${g.member_count!==1?'s':''}</div>
                    </div>
                    <a href="/user-groups" class="amrd-btn amrd-btn-sm amrd-btn-ghost" style="text-decoration:none">View →</a>
                </div>`).join('')
            : '<p style="color:#94a3b8;font-size:13px;margin:8px 0">No groups use this role.</p>';

        document.getElementById('panelUserList').innerHTML = `
            <div style="font-size:11px;font-weight:700;color:#374151;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px">Direct Users (${directUsers.length})</div>
            ${userItems}
            <div style="font-size:11px;font-weight:700;color:#374151;text-transform:uppercase;letter-spacing:.06em;margin-top:14px;margin-bottom:6px">Via Groups (${groups.length})</div>
            ${groupItems}`;
    }

    // ── shell (built once) ──────────────────────────────────────────────────
    function load() {
        root.innerHTML = `
        <div class="amrd-search-bar">
            <div class="amrd-search-field">
                <label>Name / Label / Description</label>
                <input id="sf-q" type="text" placeholder="Search…">
            </div>
            <div class="amrd-search-field">
                <label>Type</label>
                <select id="sf-type">
                    <option value="">All</option>
                    <option value="system">System</option>
                    <option value="custom">Custom</option>
                </select>
            </div>
            <div class="amrd-search-actions">
                <button class="amrd-btn amrd-btn-primary amrd-btn-sm" id="btn-search">Search</button>
                <button class="amrd-btn amrd-btn-ghost amrd-btn-sm" id="btn-reset">Reset</button>
            </div>
        </div>

        <div class="amrd-flex-row">
            <!-- Roles list -->
            <div style="flex:1;min-width:0">
                <div class="amrd-toolbar">
                    <span id="roles-count" style="font-size:13px;color:#64748b"></span>
                    <div style="display:flex;gap:8px">
                        <button class="amrd-btn amrd-btn-ghost amrd-btn-sm" id="btn-export">Export CSV</button>
                        <button class="amrd-btn amrd-btn-primary" onclick="openNewRole()">+ New Role</button>
                    </div>
                </div>

                <div class="amrd-card" style="padding:0">
                    <div class="amrd-table-wrap">
                    <table class="amrd-table">
                        <thead><tr>
                            <th>Name</th><th>Label</th><th>Description</th><th>Direct Users</th><th>Groups</th><th>Type</th><th>Actions</th>
                        </tr></thead>
                        <tbody id="roles-tbody"></tbody>
                    </table>
                    </div>
                </div>
                <div id="roles-pagination"></div>

                <p style="font-size:12px;color:#94a3b8;margin-top:12px">
                    System roles are built-in and cannot be deleted, but their labels and descriptions can be edited.<br>
                    Custom roles can be deleted only when no users or groups are assigned to them.
                </p>
            </div>

            <!-- Detail panel -->
            <div id="usersPanel" class="amrd-side-panel" style="display:none;flex-direction:column;width:320px;flex-shrink:0">
                <div class="amrd-card" style="flex:1">
                    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
                        <h3 id="usersPanelTitle" style="margin:0;font-size:13px;font-weight:700"></h3>
                        <button class="amrd-btn amrd-btn-sm amrd-btn-ghost" onclick="closePanel()">✕</button>
                    </div>
                    <div id="panelUserList"></div>
                    <div style="margin-top:14px;padding-top:12px;border-top:1px solid #f1f5f9;display:flex;gap:8px">
                        <a href="/users" class="amrd-btn amrd-btn-ghost amrd-btn-sm" style="flex:1;text-align:center;text-decoration:none">Users →</a>
                        <a href="/user-groups" class="amrd-btn amrd-btn-ghost amrd-btn-sm" style="flex:1;text-align:center;text-decoration:none">Groups →</a>
                    </div>
                </div>
            </div>
        </div>

        <!-- Role Modal -->
        <div id="roleModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:1000;align-items:center;justify-content:center">
            <div style="background:#fff;border-radius:12px;padding:28px;width:100%;max-width:400px;box-shadow:0 20px 60px rgba(0,0,0,.3)">
                <h3 id="rmTitle" style="margin:0 0 20px;font-size:16px;color:#0f172a"></h3>
                <div id="rmErr" style="color:#dc2626;font-size:13px;margin-bottom:10px"></div>
                <div class="amrd-form-row full"><div>
                    <label>Role name * <span style="color:#94a3b8;font-weight:400">(lowercase_with_underscores, permanent)</span></label>
                    <input id="rmName" type="text" placeholder="e.g. finance_lead">
                </div></div>
                <div class="amrd-form-row full"><div>
                    <label>Display label *</label>
                    <input id="rmLabel" type="text" placeholder="e.g. Finance Lead">
                </div></div>
                <div class="amrd-form-row full"><div>
                    <label>Description</label>
                    <input id="rmDesc" type="text" placeholder="What this role can do">
                </div></div>
                <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:8px">
                    <button class="amrd-btn amrd-btn-ghost" onclick="closeRoleModal()">Cancel</button>
                    <button class="amrd-btn amrd-btn-primary" onclick="saveRole()">Save</button>
                </div>
            </div>
        </div>`;

        window.openNewRole    = () => roleModal(true);
        window.openEditRole   = (id) => roleModal(true, roles.find(r => r.id == id));
        window.closeRoleModal = () => roleModal(false);
        window.saveRole       = saveRole;
        window.deleteRole     = deleteRole;
        window.viewUsers      = (id) => usersPanel(true, id);
        window.closePanel     = () => usersPanel(false);

        document.getElementById('btn-search').addEventListener('click', () => {
            _search.q    = document.getElementById('sf-q').value;
            _search.type = document.getElementById('sf-type').value;
            applySearch();
        });
        document.getElementById('btn-reset').addEventListener('click', () => {
            _search = { q: '', type: '' };
            document.getElementById('sf-q').value = '';
            document.getElementById('sf-type').value = '';
            applySearch();
        });
        document.getElementById('btn-export').addEventListener('click', exportRoles);
        document.getElementById('sf-q').addEventListener('keydown', e => {
            if (e.key === 'Enter') document.getElementById('btn-search').click();
        });
    }

    function applySearch() {
        const q = _search.q.trim().toLowerCase();
        _filtered = roles.filter(r => {
            if (q) {
                const hay = (r.name + ' ' + r.label + ' ' + (r.description || '')).toLowerCase();
                if (!hay.includes(q)) return false;
            }
            if (_search.type === 'system' && !r.is_system) return false;
            if (_search.type === 'custom' &&  r.is_system) return false;
            return true;
        }).map(r => ({
            ...r,
            user_count:  r.user_count || 0,
            group_count: (r.groups || []).length,
            type_label:  r.is_system ? 'System' : 'Custom',
        }));
        _page = 1;
        renderTable();
    }

    function renderTable() {
        const pageRows = window.__amrd.paginate(_filtered, _page, PAGE_SIZE);
        document.getElementById('roles-tbody').innerHTML = pageRows.length ? pageRows.map(r => `
            <tr style="cursor:pointer" onclick="viewUsers(${r.id})">
                <td><code style="background:#f1f5f9;padding:2px 7px;border-radius:4px;font-size:12px">${r.name}</code></td>
                <td style="font-weight:600">${r.label}</td>
                <td style="color:#64748b;max-width:200px">${r.description || '—'}</td>
                <td>
                    <span class="amrd-badge" style="background:#dbeafe;color:#1d4ed8;cursor:pointer"
                          onclick="event.stopPropagation();viewUsers(${r.id})">
                        ${r.user_count} user${r.user_count!==1?'s':''}
                    </span>
                </td>
                <td>
                    <span class="amrd-badge" style="background:#f0fdf4;color:#15803d;cursor:pointer"
                          onclick="event.stopPropagation();viewUsers(${r.id})">
                        ${r.group_count} group${r.group_count!==1?'s':''}
                    </span>
                </td>
                <td>
                    ${r.is_system
                        ? '<span class="amrd-badge" style="background:#fef3c7;color:#d97706">System</span>'
                        : '<span class="amrd-badge" style="background:#f0fdf4;color:#15803d">Custom</span>'}
                </td>
                <td onclick="event.stopPropagation()">
                    <button class="amrd-btn amrd-btn-sm amrd-btn-ghost" onclick="openEditRole(${r.id})">Edit</button>
                    ${!r.is_system
                        ? `<button class="amrd-btn amrd-btn-sm" style="background:#fee2e2;color:#dc2626;margin-left:6px"
                               onclick="deleteRole(${r.id})">Delete</button>`
                        : ''}
                </td>
            </tr>`).join('') : '<tr><td colspan="7" style="color:#94a3b8;text-align:center;padding:24px">No roles found</td></tr>';

        document.getElementById('roles-count').textContent = `${_filtered.length} role${_filtered.length !== 1 ? 's' : ''}`;
        window.__amrd.renderPagination(document.getElementById('roles-pagination'), {
            page: _page, pageSize: PAGE_SIZE, total: _filtered.length,
            onChange: (p) => { _page = p; renderTable(); },
        });
    }

    function exportRoles() {
        window.__amrd.exportCsv('roles.csv', _filtered, columns);
    }

    load();
    await refresh();
});
</script>
</body>
</html>
