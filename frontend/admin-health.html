<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
  <title>System Health — AmaraData Platform</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="/js/platform.js"></script>
</head>
<body>
<script>
document.addEventListener('DOMContentLoaded', async () => {
    const root = window.__amrd.renderSidebar('System Health');

    async function load() {
        root.innerHTML = '<p style="color:#94a3b8;padding:20px">Loading…</p>';
        try {
            const [healthRes, progressRes] = await Promise.all([
                window.__amrd.apiFetch('/api/admin/health'),
                window.__amrd.apiFetch('/api/admin/sync-progress').catch(() => ({ data: { tables: {} } })),
            ]);
            render(healthRes.data, progressRes.data?.tables || {});
        } catch (e) {
            root.innerHTML = `<p style="color:#dc2626;padding:20px">Failed to load health data: ${e.message}</p>`;
        }
    }

    function fmtSyncedAt(entry) {
        if (!entry) return '<span style="color:#94a3b8">never</span>';
        const when = new Date(entry.synced_at).toLocaleString();
        return entry.success
            ? `<span style="color:#16a34a">✓</span> ${when}`
            : `<span style="color:#dc2626" title="${(entry.error || '').replace(/"/g, '&quot;')}">✗ failed</span> ${when}`;
    }

    function badge(text, color) {
        return `<span style="display:inline-block;padding:2px 10px;border-radius:20px;font-size:12px;font-weight:600;background:${color}20;color:${color}">${text}</span>`;
    }

    // One request per table (POST /api/admin/sync-from-db/:table), driven from
    // here rather than looped server-side in a single request — a single
    // request handling every table risked ApiFn's 29s Lambda timeout and a
    // large aggregate response as the number/size of tables grows. Sequential
    // (not Promise.all) so this stays predictable under the shared write pool
    // and each table's progress is visible as it happens. The table currently
    // being exported is shown both on the button and highlighted directly in
    // the Table Row Counts grid below, with its "Last Synced" cell updated as
    // each request completes — .progress.json (backend/db.js's
    // updateSyncProgress()) is the server-side record of this, so it also
    // survives a page reload mid-sync.
    //
    // Resumable by default: if a table's own sync request hits ApiFn's 29s
    // Lambda timeout (or the tab is closed/reloaded mid-sync), that table
    // simply never gets a .progress.json entry — re-clicking the button skips
    // every table already marked success:true and only retries what's left,
    // rather than redoing the whole table list from the start. The "Force
    // full re-sync" checkbox overrides this for when the DB has changed since
    // the last sync and every table genuinely needs a fresh export, not just
    // the incomplete ones.
    async function syncFromDb() {
        const btn = document.getElementById('amrd-sync-from-db-btn');
        const forceAll = document.getElementById('amrd-sync-force')?.checked || false;
        if (!btn) return;
        const original = btn.textContent;
        btn.disabled = true;
        try {
            const [tablesRes, progressRes] = await Promise.all([
                window.__amrd.apiFetch('/api/admin/sync-tables'),
                window.__amrd.apiFetch('/api/admin/sync-progress').catch(() => ({ data: { tables: {} } })),
            ]);
            const allTables = tablesRes.data || [];
            const progress   = progressRes.data?.tables || {};
            const tables     = forceAll ? allTables : allTables.filter(t => !progress[t]?.success);
            const failed     = [];

            if (!tables.length) {
                btn.textContent = '✓ Already up to date';
                setTimeout(() => { btn.disabled = false; btn.textContent = original; }, 2500);
                return;
            }

            for (let i = 0; i < tables.length; i++) {
                const table = tables[i];
                btn.textContent = `⇅ Syncing ${table}… (${i + 1}/${tables.length})`;
                const row = document.querySelector(`tr[data-table="${table}"]`);
                const cell = row?.querySelector('.amrd-sync-cell');
                if (cell) cell.innerHTML = '<span style="color:#3b82f6">⇅ syncing…</span>';
                if (row) row.style.background = '#eff6ff';

                try {
                    const res = await window.__amrd.apiFetch(`/api/admin/sync-from-db/${table}`, { method: 'POST' });
                    if (!res.success) failed.push(table);
                    if (cell) cell.innerHTML = fmtSyncedAt({ success: res.success, synced_at: new Date().toISOString(), error: res.error });
                } catch (e) {
                    failed.push(table);
                    if (cell) cell.innerHTML = fmtSyncedAt({ success: false, synced_at: new Date().toISOString(), error: e.message });
                } finally {
                    if (row) row.style.background = '';
                }
            }

            btn.textContent = failed.length ? `⚠ ${failed.length} failed` : '✓ Synced';
        } catch (e) {
            btn.textContent = '✗ Failed';
        } finally {
            setTimeout(() => { btn.disabled = false; btn.textContent = original; }, 2500);
        }
    }
    window.syncFromDb = syncFromDb;

    // Plain <a href> can't carry the Bearer auth header (no cookie session in
    // this app), so protected downloads fetch as a blob and trigger the save
    // via a throwaway object URL instead — same pattern as email.html's
    // downloadFile(). Needed here specifically because in production
    // mirrorTableToFile() writes to S3, not local disk (see
    // project-nondb-read-only.md) — this is the only way to actually retrieve
    // the synced snapshot.
    async function downloadSyncedFiles() {
        const link = document.getElementById('amrd-sync-download-link');
        if (!link) return;
        const original = link.textContent;
        try {
            const token = localStorage.getItem('amrd_token');
            const res = await fetch('/api/admin/sync-from-db/download', { headers: { Authorization: `Bearer ${token}` } });
            if (!res.ok) throw new Error('Download failed');
            const blob = await res.blob();
            const url  = URL.createObjectURL(blob);
            const a    = document.createElement('a');
            a.href = url;
            a.download = 'transactiondata.zip';
            document.body.appendChild(a);
            a.click();
            a.remove();
            URL.revokeObjectURL(url);
        } catch (e) {
            link.textContent = '✗ Download failed';
            setTimeout(() => { link.textContent = original; }, 2500);
        }
    }
    window.downloadSyncedFiles = downloadSyncedFiles;

    function render(data, syncProgress) {
        syncProgress = syncProgress || {};
        const { versions, environment, mode, tables } = data;
        const modeColor  = mode === 'nondb' ? '#f59e0b' : '#22c55e';
        const envColor   = environment === 'production' ? '#ef4444' : '#3b82f6';
        // sync-from-db 400s in NonDB mode (no DB to sync from) — hide it there.
        const syncButton = mode === 'nondb' ? '' : `
                    <button id="amrd-sync-from-db-btn" onclick="syncFromDb()" title="Recreate transactiondata/*.json from the current DB state, one table per request. Skips tables already synced unless 'Force full re-sync' is checked." style="padding:6px 16px;border:1px solid #d1d5db;border-radius:7px;background:#fff;color:#334155;font-size:13px;font-weight:600;cursor:pointer">⇅ Sync DB → Files</button>
                    <label style="display:flex;align-items:center;gap:5px;font-size:12px;color:#64748b;cursor:pointer" title="By default, re-clicking Sync only retries tables that failed or timed out last time. Check this to re-sync every table regardless of prior progress — e.g. after DB data changed.">
                        <input id="amrd-sync-force" type="checkbox" style="cursor:pointer">Force full re-sync
                    </label>
                    <a id="amrd-sync-download-link" href="javascript:void(0)" onclick="downloadSyncedFiles()" title="Download the synced transactiondata/*.json files as a zip — the only way to retrieve them in production, where they're written to S3 instead of local disk" style="padding:6px 16px;border:1px solid #d1d5db;border-radius:7px;background:#fff;color:#334155;font-size:13px;font-weight:600;text-decoration:none;display:inline-block">⬇ Download Synced Files</a>`;

        const versionRows = [
            { label: 'API Version',  value: versions.api,  note: '' },
            { label: 'UI Version',   value: versions.ui,   note: '' },
            { label: 'DB Schema',    value: versions.db,   note: versions.dbAppliedAt ? `applied ${new Date(versions.dbAppliedAt).toLocaleString()}` : '' },
        ].map(r => `
            <tr>
                <td style="padding:10px 16px;color:#64748b;font-size:13px">${r.label}</td>
                <td style="padding:10px 16px;font-weight:600;font-size:14px;font-family:monospace">${r.value}</td>
                <td style="padding:10px 16px;color:#94a3b8;font-size:12px">${r.note}</td>
            </tr>`).join('');

        const tableRows = Object.entries(tables || {}).map(([t, n]) => `
            <tr data-table="${t}">
                <td style="padding:8px 16px;color:#64748b;font-size:13px;font-family:monospace">${t}</td>
                <td style="padding:8px 16px;font-weight:600;text-align:right;font-size:14px">${n !== null ? n.toLocaleString() : '<span style="color:#94a3b8">—</span>'}</td>
                <td class="amrd-sync-cell" style="padding:8px 16px;font-size:12px;color:#64748b">${fmtSyncedAt(syncProgress[t])}</td>
            </tr>`).join('');

        root.innerHTML = `
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:10px">
                <div style="display:flex;gap:10px;align-items:center">
                    ${badge(environment, envColor)}
                    ${badge(mode === 'nondb' ? 'NonDB mode' : 'DB mode', modeColor)}
                </div>
                <div style="display:flex;gap:8px">
                    ${syncButton}
                    <button onclick="load()" style="padding:6px 16px;border:1px solid #d1d5db;border-radius:7px;background:#fff;color:#334155;font-size:13px;font-weight:600;cursor:pointer">↻ Refresh</button>
                </div>
            </div>

            <div class="amrd-card" style="margin-bottom:20px">
                <h3 style="margin:0 0 12px;font-size:14px;font-weight:700;color:#475569;text-transform:uppercase;letter-spacing:.05em">Versions</h3>
                <table style="width:100%;border-collapse:collapse">
                    <tbody>${versionRows}</tbody>
                </table>
            </div>

            <div class="amrd-card">
                <h3 style="margin:0 0 12px;font-size:14px;font-weight:700;color:#475569;text-transform:uppercase;letter-spacing:.05em">Table Row Counts</h3>
                <table style="width:100%;border-collapse:collapse">
                    <thead><tr>
                        <th style="padding:8px 16px;text-align:left;font-size:11px;color:#94a3b8;text-transform:uppercase;letter-spacing:.04em">Table</th>
                        <th style="padding:8px 16px;text-align:right;font-size:11px;color:#94a3b8;text-transform:uppercase;letter-spacing:.04em">Rows</th>
                        <th style="padding:8px 16px;text-align:left;font-size:11px;color:#94a3b8;text-transform:uppercase;letter-spacing:.04em">Last Synced to Files</th>
                    </tr></thead>
                    <tbody>${tableRows}</tbody>
                </table>
            </div>`;
    }

    load();
    // Expose for the Refresh button
    window.load = load;
});
</script>
</body>
</html>
