<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
  <title>Sitemap — AmaraData Platform</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="/js/platform.js"></script>
  <style>
    .sm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px;margin-top:4px;}
    .sm-section{background:#1e293b;border:1px solid #334155;border-radius:10px;padding:20px 22px;}
    .sm-section h3{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#5EC8EA;margin:0 0 14px;}
    .sm-links{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;}
    .sm-links a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:7px;color:#cbd5e1;text-decoration:none;font-size:14px;font-weight:500;transition:background .15s,color .15s;}
    .sm-links a:hover{background:rgba(0, 140, 187,.15);color:#5EC8EA;}
    .sm-links a .sm-badge{margin-left:auto;font-size:10px;font-weight:700;letter-spacing:.04em;padding:2px 7px;border-radius:99px;background:rgba(99,102,241,.2);color:#a5b4fc;}
    .sm-links a .sm-badge.admin{background:rgba(245,158,11,.15);color:#fbbf24;}
    .sm-links a .sm-badge.public{background:rgba(34,197,94,.12);color:#86efac;}
    .sm-icon{width:18px;height:18px;opacity:.7;}
  </style>
</head>
<body>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
        const root = window.__amrd.renderSidebar('Sitemap');

        root.innerHTML = `
            <p style="color:#64748b;font-size:13px;margin-bottom:20px">All pages and sections in the AmaraData Platform console.</p>
            <div class="sm-grid">

                <div class="sm-section">
                    <h3>Main</h3>
                    <ul class="sm-links">
                        <li><a href="/dashboard">
                            <svg class="sm-icon" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
                            Dashboard
                        </a></li>
                        <li><a href="/tenants">
                            <svg class="sm-icon" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M3 21V7l9-4 9 4v14"/><path d="M9 21V13h6v8"/></svg>
                            Tenants
                        </a></li>
                        <li><a href="/invoices">
                            <svg class="sm-icon" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
                            Invoices
                        </a></li>
                        <li><a href="/enhancements">
                            <svg class="sm-icon" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
                            Enhancements
                        </a></li>
                        <li><a href="/metrics">
                            <svg class="sm-icon" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
                            Billing Metrics
                        </a></li>
                        <li><a href="/email">
                            <svg class="sm-icon" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
                            Email
                            <span class="sm-badge admin">admin</span>
                        </a></li>
                    </ul>
                </div>

                <div class="sm-section">
                    <h3>Administration</h3>
                    <ul class="sm-links">
                        <li><a href="/users">
                            <svg class="sm-icon" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                            Users
                            <span class="sm-badge admin">site_admin</span>
                        </a></li>
                        <li><a href="/user-groups">
                            <svg class="sm-icon" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                            User Groups
                            <span class="sm-badge admin">site_admin</span>
                        </a></li>
                        <li><a href="/roles">
                            <svg class="sm-icon" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                            Roles
                            <span class="sm-badge admin">site_admin</span>
                        </a></li>
                    </ul>
                </div>

                <div class="sm-section">
                    <h3>Account &amp; Auth</h3>
                    <ul class="sm-links">
                        <li><a href="/login">
                            <svg class="sm-icon" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
                            Sign In
                            <span class="sm-badge public">public</span>
                        </a></li>
                        <li><a href="/forgot-password">
                            <svg class="sm-icon" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
                            Forgot Password
                            <span class="sm-badge public">public</span>
                        </a></li>
                        <li><a href="/reset-password">
                            <svg class="sm-icon" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                            Reset Password
                            <span class="sm-badge public">public</span>
                        </a></li>
                    </ul>
                </div>

                <div class="sm-section">
                    <h3>Legal &amp; Reference</h3>
                    <ul class="sm-links">
                        <li><a href="/terms">
                            <svg class="sm-icon" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
                            Terms &amp; Conditions
                            <span class="sm-badge public">public</span>
                        </a></li>
                        <li><a href="/sitemap">
                            <svg class="sm-icon" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><circle cx="12" cy="5" r="2"/><circle cx="5" cy="19" r="2"/><circle cx="19" cy="19" r="2"/><path d="M12 7v4M7 19h10M12 11l-5 6M12 11l5 6"/></svg>
                            Sitemap
                        </a></li>
                    </ul>
                </div>

            </div>`;
    });
  </script>
</body>
</html>
