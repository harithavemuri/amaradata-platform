<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
  <title>Billing Contacts — AmaraData Platform</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="/js/platform.js"></script>
</head>
<body>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
        const root = window.__amrd.renderSidebar('Billing Contacts');

        let _myTenants  = [];
        let _contacts   = [];
        let _page       = 1;
        const PAGE_SIZE = 20;

        const tr = await window.__amrd.apiFetch('/api/tenants/mine');
        _myTenants = tr.data || [];
        const tenantName = (id) => _myTenants.find((t) => t.id == id)?.name || `Tenant ${id}`;

        function load() {
            root.innerHTML = `
                <div class="amrd-toolbar">
                    <span id="bc-count" style="font-size:13px;color:#64748b"></span>
                    ${window.__amrd.isReadOnly() ? '' : '<button class="amrd-btn amrd-btn-primary amrd-btn-sm" onclick="openContactForm()">+ New Contact</button>'}
                </div>
                <div class="amrd-card" style="padding:0">
                    <div class="amrd-table-wrap">
                    <table class="amrd-table">
                        <thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Billing Scopes</th><th></th></tr></thead>
                        <tbody id="bc-tbody"></tbody>
                    </table>
                    </div>
                </div>
                <div id="bc-pagination"></div>
                <div id="form-slot"></div>
                <div id="scopes-modal-slot"></div>`;
        }

        async function runSearch() {
            const res = await window.__amrd.apiFetch('/api/billing-contacts');
            _contacts = res.data || [];
            _page = 1;
            renderTable();
        }

        function renderTable() {
            const tbody = document.getElementById('bc-tbody');
            const pageRows = window.__amrd.paginate(_contacts, _page, PAGE_SIZE);
            tbody.innerHTML = pageRows.map((c) => `
                <tr>
                    <td><strong>${c.name}</strong></td>
                    <td>${c.email}</td>
                    <td>${c.phone || '—'}</td>
                    <td><button class="amrd-btn amrd-btn-ghost amrd-btn-sm" onclick="openScopes(${c.id})">Manage Billing Scopes</button></td>
                    <td>
                        ${window.__amrd.isReadOnly() ? '' : `
                            <button class="amrd-btn amrd-btn-ghost amrd-btn-sm" onclick="openContactForm(${c.id})">Edit</button>
                            <button class="amrd-btn amrd-btn-ghost amrd-btn-sm" onclick="deleteContact(${c.id})">Delete</button>
                        `}
                    </td>
                </tr>`).join('') || '<tr><td colspan="5" style="color:#94a3b8;text-align:center;padding:24px">No billing contacts yet</td></tr>';

            document.getElementById('bc-count').textContent = `${_contacts.length} contact(s)`;
            window.__amrd.renderPagination(document.getElementById('bc-pagination'), {
                page: _page, pageSize: PAGE_SIZE, total: _contacts.length,
                onChange: (p) => { _page = p; renderTable(); },
            });
        }

        function openContactForm(id) {
            const existing = id ? _contacts.find((c) => c.id === id) : null;
            const slot = document.getElementById('form-slot');
            slot.innerHTML = `
                <div class="amrd-card">
                    <h3>${existing ? 'Edit' : 'New'} Billing Contact</h3>
                    <div class="amrd-form-row">
                        <div><label>Name *</label><input id="f-name" value="${existing?.name || ''}"></div>
                        <div><label>Email *</label><input id="f-email" value="${existing?.email || ''}"></div>
                    </div>
                    <div class="amrd-form-row">
                        <div><label>Phone</label><input id="f-phone" value="${existing?.phone || ''}"></div>
                        <div><label>GSTIN</label><input id="f-gstin" value="${existing?.gstin || ''}"></div>
                    </div>
                    <div class="amrd-form-row">
                        <div><label>PAN</label><input id="f-pan" value="${existing?.pan || ''}"></div>
                        <div><label>Billing Address</label><input id="f-address" value="${existing?.billing_address || ''}"></div>
                    </div>
                    <div class="amrd-form-row full"><div><label>Notes</label><textarea id="f-notes" rows="2">${existing?.notes || ''}</textarea></div></div>
                    <div style="margin-top:16px;display:flex;gap:10px">
                        <button class="amrd-btn amrd-btn-primary" onclick="saveContact(${existing ? existing.id : 'null'})">Save</button>
                        <button class="amrd-btn amrd-btn-ghost" onclick="document.getElementById('form-slot').innerHTML=''">Cancel</button>
                    </div>
                    <div id="save-err" style="color:#dc2626;font-size:13px;margin-top:8px"></div>
                </div>`;
        }

        async function saveContact(id) {
            const body = {
                name: document.getElementById('f-name').value,
                email: document.getElementById('f-email').value,
                phone: document.getElementById('f-phone').value || null,
                gstin: document.getElementById('f-gstin').value || null,
                pan: document.getElementById('f-pan').value || null,
                billing_address: document.getElementById('f-address').value || null,
                notes: document.getElementById('f-notes').value || null,
            };
            try {
                await window.__amrd.apiFetch(id ? `/api/billing-contacts/${id}` : '/api/billing-contacts', {
                    method: id ? 'PUT' : 'POST',
                    body: JSON.stringify(body),
                });
                document.getElementById('form-slot').innerHTML = '';
                await runSearch();
            } catch (e) {
                document.getElementById('save-err').textContent = e.message;
            }
        }

        async function deleteContact(id) {
            if (!confirm('Delete this billing contact and all of its scope assignments?')) return;
            try {
                await window.__amrd.apiFetch(`/api/billing-contacts/${id}`, { method: 'DELETE' });
                await runSearch();
            } catch (e) {
                alert(e.message);
            }
        }

        const SCOPE_LABELS = { tenant: 'Whole Tenant', project: 'Project', property: 'Property' };

        async function openScopes(contactId) {
            const slot = document.getElementById('scopes-modal-slot');
            slot.innerHTML = `
                <div style="display:flex;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:1000;align-items:center;justify-content:center">
                    <div style="background:#fff;border-radius:12px;padding:28px;width:100%;max-width:600px;max-height:85vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)">
                        <h3 style="margin:0 0 4px;font-size:16px;color:#0f172a">Billing Scopes</h3>
                        <p style="margin:0 0 16px;font-size:12px;color:#94a3b8">
                            Which tenant(s)/project(s)/propert(y/ies) this contact is billed for. The same
                            contact can be scoped across MULTIPLE tenants — each row below is independent.
                        </p>
                        <div id="scopes-err" style="color:#dc2626;font-size:13px;margin-bottom:10px"></div>
                        <div id="scopes-body">Loading…</div>
                        ${window.__amrd.isReadOnly() ? '' : `
                            <div style="margin-top:16px;padding-top:16px;border-top:1px solid #f1f5f9">
                                <h4 style="font-size:13px;margin:0 0 8px">Add Billing Scope(s)</h4>
                                <div class="amrd-form-row">
                                    <div><label>Tenant(s) *</label>
                                        <select id="s-tenant" multiple size="4" style="width:100%">
                                            ${_myTenants.map((t) => `<option value="${t.id}">${t.name}</option>`).join('')}
                                        </select>
                                        <div style="font-size:11px;color:#94a3b8;margin-top:2px">Ctrl/Cmd-click to select multiple. For Project/Property scope, select exactly one.</div>
                                    </div>
                                    <div><label>Scope Type *</label>
                                        <select id="s-type" onchange="onScopeTypeChange()">
                                            <option value="tenant">Whole Tenant(s)</option>
                                            <option value="project">Project(s)</option>
                                            <option value="property">Propert(y/ies)</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="amrd-form-row" id="s-project-row" style="display:none">
                                    <div><label>Project(s)</label>
                                        <select id="s-project-picker" multiple size="4" style="width:100%" onchange="onProjectPickerChange()">
                                        </select>
                                        <button type="button" class="amrd-btn amrd-btn-ghost amrd-btn-sm" style="margin-top:4px" onclick="loadTenantProjects()">Load Projects</button>
                                    </div>
                                    <div><label>Project ID(s) *</label>
                                        <input id="s-project-id" placeholder="e.g. 101, 102, 103">
                                        <div style="font-size:11px;color:#94a3b8;margin-top:2px">Comma-separated tenant project ids — one project-level scope is created per id.</div>
                                    </div>
                                </div>
                                <div class="amrd-form-row" id="s-property-row" style="display:none">
                                    <div><label>Propert(y/ies)</label>
                                        <select id="s-property-picker" multiple size="4" style="width:100%" onchange="onPropertyPickerChange()">
                                        </select>
                                        <div style="display:flex;gap:6px;margin-top:4px">
                                            <input id="s-property-search" placeholder="search by code/name (optional)" style="flex:1">
                                            <button type="button" class="amrd-btn amrd-btn-ghost amrd-btn-sm" onclick="loadTenantProperties()">Load Properties</button>
                                        </div>
                                    </div>
                                    <div><label>Property ID(s) *</label>
                                        <input id="s-property-id" placeholder="e.g. 1, 2, 3">
                                        <div style="font-size:11px;color:#94a3b8;margin-top:2px">Comma-separated tenant property ids (within the one project above).</div>
                                    </div>
                                </div>
                                <button class="amrd-btn amrd-btn-primary amrd-btn-sm" style="margin-top:10px" onclick="addScopes(${contactId})">Add Billing Scope(s)</button>
                                <div id="scopes-add-note" style="font-size:12px;color:#64748b;margin-top:8px"></div>
                            </div>
                        `}
                        <div style="display:flex;justify-content:flex-end;margin-top:16px">
                            <button class="amrd-btn amrd-btn-ghost" onclick="closeScopes()">Close</button>
                        </div>
                    </div>
                </div>`;
            await loadScopesBody(contactId);
        }

        async function loadScopesBody(contactId) {
            try {
                const res = await window.__amrd.apiFetch(`/api/billing-contacts/${contactId}`);
                renderScopesBody(res.data.scopes || []);
            } catch (e) {
                document.getElementById('scopes-body').innerHTML = '';
                document.getElementById('scopes-err').textContent = e.message;
            }
        }

        function renderScopesBody(scopes) {
            const body = document.getElementById('scopes-body');
            if (!scopes.length) {
                body.innerHTML = '<p style="color:#94a3b8;font-size:13px">No scopes assigned yet — this contact will not receive anything until at least one scope is added.</p>';
                return;
            }
            body.innerHTML = `
                <table class="amrd-table">
                    <thead><tr><th>Tenant</th><th>Scope</th><th>Project ID</th><th>Property ID</th><th></th></tr></thead>
                    <tbody>
                        ${scopes.map((s) => `
                            <tr>
                                <td>${s.tenant_name || tenantName(s.tenant_id)}</td>
                                <td>${SCOPE_LABELS[s.scope_type] || s.scope_type}</td>
                                <td>${s.tenant_project_id ?? '—'}</td>
                                <td>${s.tenant_property_id ?? '—'}</td>
                                <td>${window.__amrd.isReadOnly() ? '' : `<button class="amrd-btn amrd-btn-ghost amrd-btn-sm" onclick="removeScope(${s.id}, ${s.billing_contact_id})">Remove</button>`}</td>
                            </tr>`).join('')}
                    </tbody>
                </table>`;
        }

        function onScopeTypeChange() {
            const type = document.getElementById('s-type').value;
            document.getElementById('s-project-row').style.display  = (type === 'project' || type === 'property') ? 'grid' : 'none';
            document.getElementById('s-property-row').style.display = (type === 'property') ? 'grid' : 'none';
        }

        function selectedTenantIds() {
            return [...document.getElementById('s-tenant').selectedOptions].map((o) => parseInt(o.value, 10));
        }

        // Comma/whitespace-separated list of ids -> deduped array of ints,
        // silently dropping anything that doesn't parse (a trailing comma,
        // stray space) rather than erroring on it.
        function parseIdList(raw) {
            return [...new Set((raw || '').split(/[,\s]+/).map((s) => parseInt(s, 10)).filter((n) => Number.isFinite(n)))];
        }

        // Reuses the same SSO project-modules proxy tenants.html's "Modules"
        // button already calls — the only tenant-side endpoint AmaraData has
        // that returns real {project_id, project_name} pairs. Properties have
        // their own dedicated picker below (loadTenantProperties, via
        // GET /api/tenants/:id/billing-properties) — see
        // project-billing-contact-routing.md.
        //
        // That endpoint is super_admin-only (tenants.js's requireSuperAdmin),
        // one level stricter than billing-contacts' own requireAdmin — a
        // plain admin can still fully use this page, just by typing the
        // Project ID(s) directly instead of picking from this list.
        async function loadTenantProjects() {
            const tenantIds = selectedTenantIds();
            const picker = document.getElementById('s-project-picker');
            if (tenantIds.length !== 1) {
                document.getElementById('scopes-err').textContent = 'Select exactly one tenant to load its projects.';
                return;
            }
            document.getElementById('scopes-err').textContent = '';
            try {
                const res = await window.__amrd.apiFetch(`/api/tenants/${tenantIds[0]}/modules`);
                const projects = [...new Map((res.data || []).map((r) => [r.project_id, r.project_name])).entries()];
                picker.innerHTML = projects.map(([id, name]) => `<option value="${id}">${name || `Project ${id}`}</option>`).join('');
            } catch (e) {
                document.getElementById('scopes-err').textContent = window.__amrd.getStaff()?.role === 'super_admin'
                    ? e.message
                    : 'Only super_admin can browse the live project list — enter the Project ID(s) directly instead.';
            }
        }

        // Picking one or more projects from the live-loaded list appends
        // their ids into the same comma-separated Project ID(s) field the
        // free-text path uses — the two entry methods feed one field, so a
        // staff member can mix "picked from the list" with "typed by hand".
        function onProjectPickerChange() {
            const picked = [...document.getElementById('s-project-picker').selectedOptions].map((o) => o.value);
            const field = document.getElementById('s-project-id');
            const existing = parseIdList(field.value);
            field.value = [...new Set([...existing, ...picked.map((p) => parseInt(p, 10))])].join(', ');
        }

        // Powers the Property picker via GET /api/tenants/:id/billing-properties
        // (billing-tenant-client.js, this integration's own dedicated key —
        // NOT the SSO flow loadTenantProjects above uses, and NOT the
        // owner-portal key either). Scoped to the one Project ID already
        // entered/picked above (property ids are only meaningful within a
        // project) — takes the FIRST parsed project id if several were typed,
        // since a property-level bulk-add only ever runs against one project
        // anyway. An optional free-text search narrows the list further; left
        // blank it lists every property in that project (same "browse with no
        // query" convenience as Load Projects).
        //
        // Same requireSuperAdmin gate as Load Projects (see
        // project-billing-contact-routing.md) — a plain admin can still fully
        // use this page by typing the Property ID(s) directly instead.
        async function loadTenantProperties() {
            const tenantIds = selectedTenantIds();
            const picker = document.getElementById('s-property-picker');
            const errEl = document.getElementById('scopes-err');
            errEl.textContent = '';
            if (tenantIds.length !== 1) { errEl.textContent = 'Select exactly one tenant to load its properties.'; return; }
            const projectIds = parseIdList(document.getElementById('s-project-id').value);
            if (!projectIds.length) { errEl.textContent = 'Enter or pick a Project ID first — properties are looked up within one project.'; return; }
            const q = document.getElementById('s-property-search').value.trim();
            try {
                const params = new URLSearchParams({ project_id: projectIds[0] });
                if (q) params.set('q', q);
                const res = await window.__amrd.apiFetch(`/api/tenants/${tenantIds[0]}/billing-properties?${params.toString()}`);
                picker.innerHTML = (res.data || [])
                    .map((p) => `<option value="${p.id}">${p.property_code}${p.property_name ? ` — ${p.property_name}` : ''}</option>`)
                    .join('');
            } catch (e) {
                errEl.textContent = window.__amrd.getStaff()?.role === 'super_admin'
                    ? e.message
                    : 'Only super_admin can browse the live property list — enter the Property ID(s) directly instead.';
            }
        }

        // Same "pick from list feeds the same free-text field" pattern as
        // onProjectPickerChange — picking from the list and typing by hand
        // can be mixed in one add.
        function onPropertyPickerChange() {
            const picked = [...document.getElementById('s-property-picker').selectedOptions].map((o) => o.value);
            const field = document.getElementById('s-property-id');
            const existing = parseIdList(field.value);
            field.value = [...new Set([...existing, ...picked.map((p) => parseInt(p, 10))])].join(', ');
        }

        // Builds one scope entry per (tenant × id) combination and submits
        // them all in a single bulk call — this is how "one or more
        // tenants, one or more projects, or one or more properties" in one
        // action actually works: for scope_type='tenant', every SELECTED
        // tenant becomes its own tenant-level scope (the cross-tenant bulk
        // case); for project/property, exactly one tenant must be selected
        // (a project/property id is only meaningful within one tenant) and
        // every id in the comma-separated field becomes its own scope.
        async function addScopes(contactId) {
            const errEl = document.getElementById('scopes-err');
            const noteEl = document.getElementById('scopes-add-note');
            errEl.textContent = '';
            noteEl.textContent = '';

            const tenantIds = selectedTenantIds();
            const scope_type = document.getElementById('s-type').value;
            if (!tenantIds.length) { errEl.textContent = 'Select at least one tenant.'; return; }

            let entries = [];
            if (scope_type === 'tenant') {
                entries = tenantIds.map((tenant_id) => ({ tenant_id, scope_type }));
            } else {
                if (tenantIds.length !== 1) { errEl.textContent = 'Select exactly one tenant for a Project or Property scope.'; return; }
                const projectIds = parseIdList(document.getElementById('s-project-id').value);
                if (!projectIds.length) { errEl.textContent = 'Enter at least one Project ID.'; return; }

                if (scope_type === 'project') {
                    entries = projectIds.map((tenant_project_id) => ({ tenant_id: tenantIds[0], scope_type, tenant_project_id }));
                } else {
                    const propertyIds = parseIdList(document.getElementById('s-property-id').value);
                    if (!propertyIds.length) { errEl.textContent = 'Enter at least one Property ID.'; return; }
                    // Every property id is scoped under EVERY selected project id —
                    // typically just one project, but supports "these 3 properties,
                    // each also appearing under project X and Y" without extra UI.
                    entries = projectIds.flatMap((tenant_project_id) =>
                        propertyIds.map((tenant_property_id) => ({ tenant_id: tenantIds[0], scope_type, tenant_project_id, tenant_property_id })));
                }
            }

            try {
                const res = await window.__amrd.apiFetch(`/api/billing-contacts/${contactId}/scopes/bulk`, {
                    method: 'POST', body: JSON.stringify({ scopes: entries }),
                });
                const { created, failed } = res.data;
                noteEl.textContent = `${created.length} scope(s) added.` + (failed.length ? ` ${failed.length} failed: ${failed.map((f) => f.error).join('; ')}` : '');
                await loadScopesBody(contactId);
                await runSearch();
            } catch (e) {
                errEl.textContent = e.message;
            }
        }

        async function removeScope(scopeId, contactId) {
            try {
                await window.__amrd.apiFetch(`/api/billing-contacts/scopes/${scopeId}`, { method: 'DELETE' });
                await loadScopesBody(contactId);
                await runSearch();
            } catch (e) {
                document.getElementById('scopes-err').textContent = e.message;
            }
        }

        function closeScopes() {
            document.getElementById('scopes-modal-slot').innerHTML = '';
        }

        window.openContactForm = openContactForm;
        window.saveContact     = saveContact;
        window.deleteContact   = deleteContact;
        window.openScopes      = openScopes;
        window.closeScopes     = closeScopes;
        window.onScopeTypeChange   = onScopeTypeChange;
        window.loadTenantProjects  = loadTenantProjects;
        window.onProjectPickerChange = onProjectPickerChange;
        window.loadTenantProperties  = loadTenantProperties;
        window.onPropertyPickerChange = onPropertyPickerChange;
        window.addScopes        = addScopes;
        window.removeScope      = removeScope;

        load();
        await runSearch();
    });
  </script>
</body>
</html>
