<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
  <title>User Groups — AmaraData Platform</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="/js/platform.js"></script>
</head>
<body>
<script>
document.addEventListener('DOMContentLoaded', async () => {
    const root = window.__amrd.renderSidebar('User Groups');

    let groups     = [];
    let allUsers   = [];
    let allRoles   = [];
    let allTenants = [];
    let editId     = null;
    let viewGroupId = null;

    // ── load ─────────────────────────────────────────────────────────────────
    async function loadAll() {
        root.innerHTML = '<p style="color:#94a3b8;padding:20px">Loading…</p>';
        try {
            const [gRes, uRes, rRes, tRes] = await Promise.all([
                window.__amrd.apiFetch('/api/admin/user-groups'),
                window.__amrd.apiFetch('/api/admin/users'),
                window.__amrd.apiFetch('/api/admin/roles'),
                window.__amrd.apiFetch('/api/tenants'),
            ]);
            groups     = gRes.data  || [];
            allUsers   = uRes.data  || [];
            allRoles   = rRes.data  || [];
            allTenants = tRes.data  || [];
            render();
        } catch (e) {
            root.innerHTML = `<p style="color:#dc2626;padding:20px">Failed to load: ${e.message}</p>`;
        }
    }

    // ── group modal ───────────────────────────────────────────────────────────
    function groupModal(show, g = {}) {
        editId = g.id || null;
        document.getElementById('gmTitle').textContent = editId ? 'Edit Group' : 'New Group';
        document.getElementById('gmName').value = g.name        || '';
        document.getElementById('gmDesc').value = g.description || '';
        document.getElementById('gmErr').textContent = '';
        document.getElementById('groupModal').style.display = show ? 'flex' : 'none';
    }

    async function saveGroup() {
        const name        = document.getElementById('gmName').value.trim();
        const description = document.getElementById('gmDesc').value.trim();
        const errEl       = document.getElementById('gmErr');
        if (!name) { errEl.textContent = 'Name is required'; return; }
        try {
            if (editId) {
                await window.__amrd.apiFetch(`/api/admin/user-groups/${editId}`, {
                    method: 'PUT', body: JSON.stringify({ name, description }),
                });
            } else {
                await window.__amrd.apiFetch('/api/admin/user-groups', {
                    method: 'POST', body: JSON.stringify({ name, description }),
                });
            }
            groupModal(false);
            await loadAll();
            if (viewGroupId) memberPanel(true, viewGroupId);
        } catch (e) { errEl.textContent = e.message; }
    }

    async function deleteGroup(id) {
        if (!confirm('Delete this group? All member assignments and tenant assignments will also be removed.')) return;
        try {
            await window.__amrd.apiFetch(`/api/admin/user-groups/${id}`, { method: 'DELETE' });
            if (viewGroupId == id) memberPanel(false);
            loadAll();
        } catch (e) { alert(e.message); }
    }

    // ── detail panel ─────────────────────────────────────────────────────────
    function memberPanel(show, groupId) {
        viewGroupId = groupId || null;
        if (!show) { document.getElementById('memberPanel').style.display = 'none'; return; }
        const g = groups.find(g => g.id == groupId);
        document.getElementById('memberPanelTitle').textContent = g?.name || '';
        document.getElementById('memberPanel').style.display = 'flex';
        renderPanel(g);
    }

    function roleBadge(role) {
        if (!role) return '';
        const colours = {
            site_admin:    '#7c3aed;background:#ede9fe',
            admin:         '#1d4ed8;background:#dbeafe',
            sales_manager: '#0D9488;background:#ccfbf1',
            billing:       '#d97706;background:#fef3c7',
            staff:         '#64748b;background:#f1f5f9',
        };
        const c = colours[role] || '64748b;background:#f1f5f9';
        return `<span class="amrd-badge" style="color:${c}">${role.replace(/_/g,' ')}</span>`;
    }

    function renderPanel(g) {
        if (!g) return;
        const members    = g.members    || [];
        const tenantAssn = g.tenant_assignments || [];
        const nonMembers = allUsers.filter(u => !members.some(m => m.id == u.id) && u.is_active !== false);
        const assignedTenantRolePairs = new Set(tenantAssn.map(a => `${a.tenant_id}:${a.role_id}`));
        const availTenants = allTenants;

        // Members section
        const membersHtml = `
            <div style="margin-bottom:20px">
                <div style="font-size:12px;font-weight:700;color:#374151;text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px">
                    Members (${members.length})
                </div>
                ${members.length ? members.map(m => `
                    <div style="display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid #f1f5f9">
                        <div>
                            <div style="font-weight:600;font-size:13px;color:${m.is_active!==false?'#0f172a':'#94a3b8'}">${m.name}</div>
                            <div style="font-size:11px;color:#64748b">${m.email} · ${(m.role||'').replace(/_/g,' ')}</div>
                        </div>
                        <button class="amrd-btn amrd-btn-sm" style="background:#fee2e2;color:#dc2626;flex-shrink:0"
                            onclick="removeMember(${g.id},${m.id})">Remove</button>
                    </div>`).join('')
                : '<p style="color:#94a3b8;font-size:13px;margin:6px 0">No members yet.</p>'}
                <div style="margin-top:12px;padding-top:12px;border-top:1px solid #f1f5f9;display:flex;gap:6px">
                    <select id="addMemberSelect" style="flex:1">
                        <option value="">— Add a user —</option>
                        ${nonMembers.map(u => `<option value="${u.id}">${u.name} (${u.email})</option>`).join('')}
                    </select>
                    <button class="amrd-btn amrd-btn-primary amrd-btn-sm" onclick="addMember()">Add</button>
                </div>
            </div>`;

        // Tenant assignments section
        const tenantHtml = `
            <div style="border-top:2px solid #f1f5f9;padding-top:16px">
                <div style="font-size:12px;font-weight:700;color:#374151;text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px">
                    Tenant Assignments (${tenantAssn.length})
                </div>
                <div style="font-size:11px;color:#64748b;margin-bottom:10px">
                    Members of this group inherit the assigned role within each tenant listed below.
                </div>
                ${tenantAssn.length ? tenantAssn.map(a => `
                    <div style="display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid #f8fafc">
                        <div>
                            <div style="font-weight:600;font-size:13px;color:#0f172a">${a.tenant_name || a.tenant_id}</div>
                            <div style="font-size:11px;margin-top:2px">${roleBadge(a.role)} <span style="color:#94a3b8">${a.role_label || ''}</span></div>
                        </div>
                        <button class="amrd-btn amrd-btn-sm" style="background:#fee2e2;color:#dc2626;flex-shrink:0"
                            onclick="removeTenantAssn(${g.id},${a.id})">Remove</button>
                    </div>`).join('')
                : '<p style="color:#94a3b8;font-size:13px;margin:6px 0">No tenant assignments yet.</p>'}
                <div style="margin-top:12px;padding-top:12px;border-top:1px solid #f1f5f9">
                    <div style="display:flex;gap:6px;margin-bottom:6px">
                        <select id="addTenantSelect" style="flex:1">
                            <option value="">— Tenant —</option>
                            ${availTenants.map(t => `<option value="${t.id}">${t.name}</option>`).join('')}
                        </select>
                        <select id="addRoleSelect" style="flex:1">
                            <option value="">— Role —</option>
                            ${allRoles.map(r => `<option value="${r.id}">${r.label}</option>`).join('')}
                        </select>
                    </div>
                    <button class="amrd-btn amrd-btn-primary amrd-btn-sm" style="width:100%" onclick="addTenantAssn(${g.id})">Assign Tenant + Role</button>
                </div>
            </div>`;

        document.getElementById('panelContent').innerHTML = membersHtml + tenantHtml;
    }

    async function addMember() {
        const userId = document.getElementById('addMemberSelect').value;
        if (!userId || !viewGroupId) return;
        try {
            await window.__amrd.apiFetch(`/api/admin/user-groups/${viewGroupId}/members`, {
                method: 'POST', body: JSON.stringify({ user_id: parseInt(userId) }),
            });
            await loadAll();
            memberPanel(true, viewGroupId);
        } catch (e) { alert(e.message); }
    }

    async function removeMember(groupId, userId) {
        try {
            await window.__amrd.apiFetch(`/api/admin/user-groups/${groupId}/members/${userId}`, { method: 'DELETE' });
            await loadAll();
            memberPanel(true, viewGroupId);
        } catch (e) { alert(e.message); }
    }

    async function addTenantAssn(groupId) {
        const tenantId = document.getElementById('addTenantSelect').value;
        const roleId   = document.getElementById('addRoleSelect').value;
        if (!tenantId || !roleId) { alert('Select both a tenant and a role.'); return; }
        try {
            await window.__amrd.apiFetch(`/api/admin/user-groups/${groupId}/tenants`, {
                method: 'POST', body: JSON.stringify({ tenant_id: parseInt(tenantId), role_id: parseInt(roleId) }),
            });
            await loadAll();
            memberPanel(true, viewGroupId);
        } catch (e) { alert(e.message); }
    }

    async function removeTenantAssn(groupId, gtId) {
        if (!confirm('Remove this tenant assignment?')) return;
        try {
            await window.__amrd.apiFetch(`/api/admin/user-groups/${groupId}/tenants/${gtId}`, { method: 'DELETE' });
            await loadAll();
            memberPanel(true, viewGroupId);
        } catch (e) { alert(e.message); }
    }

    // ── main render ───────────────────────────────────────────────────────────
    function render() {
        root.innerHTML = `
        <div class="amrd-flex-row">
            <!-- Groups list -->
            <div style="flex:1;min-width:0">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
                    <span style="font-size:14px;color:#64748b">${groups.length} group${groups.length !== 1 ? 's' : ''}</span>
                    <button class="amrd-btn amrd-btn-primary" onclick="openNewGroup()">+ New Group</button>
                </div>

                ${groups.length === 0
                    ? '<div class="amrd-card"><p style="color:#94a3b8;text-align:center">No groups yet.</p></div>'
                    : groups.map(g => {
                        const assns = g.tenant_assignments || [];
                        return `
                        <div class="amrd-card" style="cursor:pointer;transition:box-shadow .15s;margin-bottom:12px"
                             onclick="viewMembers(${g.id})">
                            <div style="display:flex;justify-content:space-between;align-items:flex-start">
                                <div style="flex:1;min-width:0">
                                    <div style="font-weight:700;font-size:14px;color:${g.is_active!==false?'#0f172a':'#94a3b8'};margin-bottom:3px">
                                        ${g.name}
                                        ${g.is_active===false ? '<span class="amrd-badge amrd-badge-cancelled" style="margin-left:6px">Inactive</span>' : ''}
                                    </div>
                                    <div style="font-size:12px;color:#64748b;margin-bottom:6px">${g.description || '—'}</div>
                                    <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">
                                        <span class="amrd-badge" style="background:#dbeafe;color:#1d4ed8">${g.member_count || 0} member${(g.member_count||0)!==1?'s':''}</span>
                                        ${assns.length
                                            ? assns.map(a => `<span style="font-size:11px;color:#64748b">${a.tenant_name}: ${roleBadge(a.role)}</span>`).join('')
                                            : '<span style="font-size:11px;color:#94a3b8;font-style:italic">No tenant assignments</span>'
                                        }
                                    </div>
                                </div>
                                <div onclick="event.stopPropagation()" style="display:flex;gap:6px;flex-shrink:0;margin-left:10px">
                                    <button class="amrd-btn amrd-btn-sm amrd-btn-ghost" onclick="openEditGroup(${g.id})">Edit</button>
                                    <button class="amrd-btn amrd-btn-sm" style="background:#fee2e2;color:#dc2626" onclick="deleteGroup(${g.id})">Delete</button>
                                </div>
                            </div>
                        </div>`;
                    }).join('')
                }
            </div>

            <!-- Detail panel -->
            <div id="memberPanel" class="amrd-side-panel" style="display:none;flex-direction:column;width:360px;flex-shrink:0">
                <div class="amrd-card" style="flex:1;overflow-y:auto">
                    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
                        <h3 id="memberPanelTitle" style="margin:0;font-size:14px;font-weight:700"></h3>
                        <button class="amrd-btn amrd-btn-sm amrd-btn-ghost" onclick="closeMembers()">✕</button>
                    </div>
                    <div id="panelContent"></div>
                </div>
            </div>
        </div>

        <!-- Group Modal -->
        <div id="groupModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:1000;align-items:center;justify-content:center">
            <div style="background:#fff;border-radius:12px;padding:28px;width:100%;max-width:420px;box-shadow:0 20px 60px rgba(0,0,0,.3)">
                <h3 id="gmTitle" style="margin:0 0 20px;font-size:16px;color:#0f172a"></h3>
                <div id="gmErr" style="color:#dc2626;font-size:13px;margin-bottom:10px"></div>
                <div class="amrd-form-row full"><div>
                    <label>Group Name *</label>
                    <input id="gmName" type="text" placeholder="e.g. Sales Team IN">
                </div></div>
                <div class="amrd-form-row full"><div>
                    <label>Description</label>
                    <input id="gmDesc" type="text" placeholder="Optional description">
                </div></div>
                <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:14px">
                    <button class="amrd-btn amrd-btn-ghost" onclick="closeGroupModal()">Cancel</button>
                    <button class="amrd-btn amrd-btn-primary" onclick="saveGroup()">Save</button>
                </div>
            </div>
        </div>`;

        window.openNewGroup      = () => groupModal(true);
        window.openEditGroup     = (id) => groupModal(true, groups.find(g => g.id == id));
        window.closeGroupModal   = () => groupModal(false);
        window.saveGroup         = saveGroup;
        window.deleteGroup       = deleteGroup;
        window.viewMembers       = (id) => memberPanel(true, id);
        window.closeMembers      = () => memberPanel(false);
        window.addMember         = addMember;
        window.removeMember      = removeMember;
        window.addTenantAssn     = addTenantAssn;
        window.removeTenantAssn  = removeTenantAssn;

        if (viewGroupId) memberPanel(true, viewGroupId);
    }

    loadAll();
});
</script>
</body>
</html>
