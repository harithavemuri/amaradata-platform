<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
  <title>Login Audit — AmaraData Platform</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="/js/platform.js"></script>
</head>
<body>
<script>
document.addEventListener('DOMContentLoaded', async () => {
    const root = window.__amrd.renderSidebar('Login Audit');

    let entries = [];
    let _filtered = [];
    let _page = 1;
    const PAGE_SIZE = 25;
    let _search = { q: '', method: '' };

    const fmtDateTime = d => {
        const date = new Date(d);
        return isNaN(date.getTime()) ? '—' : date.toLocaleString('en-US', {
            month: 'short', day: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit',
        });
    };

    const columns = [
        { key: 'logged_in_at', label: 'Logged In At' },
        { key: 'name',         label: 'User' },
        { key: 'email',        label: 'Email' },
        { key: 'method',       label: 'Method' },
        { key: 'ip_address',   label: 'IP Address' },
    ];

    async function fetchAll() {
        const res = await window.__amrd.apiFetch('/api/admin/login-audit');
        entries = res.data || [];
    }

    function load() {
        root.innerHTML = `
        <div class="amrd-search-bar">
            <div class="amrd-search-field">
                <label>User / Email</label>
                <input id="sf-q" type="text" placeholder="Search…">
            </div>
            <div class="amrd-search-field">
                <label>Method</label>
                <select id="sf-method">
                    <option value="">All</option>
                    <option value="password">Password</option>
                    <option value="google">Google</option>
                </select>
            </div>
            <div class="amrd-search-actions">
                <button class="amrd-btn amrd-btn-primary amrd-btn-sm" id="btn-search">Search</button>
                <button class="amrd-btn amrd-btn-ghost amrd-btn-sm" id="btn-reset">Reset</button>
            </div>
        </div>

        <div class="amrd-toolbar">
            <span id="audit-count" style="font-size:13px;color:#64748b"></span>
            <button class="amrd-btn amrd-btn-ghost amrd-btn-sm" id="btn-export">Export CSV</button>
        </div>

        <div class="amrd-card" style="padding:0">
            <div class="amrd-table-wrap">
            <table class="amrd-table">
                <thead><tr>
                    <th>Logged In At</th><th>User</th><th>Email</th><th>Method</th><th>IP Address</th>
                </tr></thead>
                <tbody id="audit-tbody"></tbody>
            </table>
            </div>
        </div>
        <div id="audit-pagination"></div>

        <p style="font-size:12px;color:#94a3b8;margin-top:12px">
            Shows the most recent 500 login events (password and Google sign-in), including in NonDB mode —
            login is tracked as a bookkeeping side effect even though NonDB mode is otherwise read-only.
        </p>`;

        document.getElementById('btn-search').addEventListener('click', () => {
            _search.q      = document.getElementById('sf-q').value;
            _search.method = document.getElementById('sf-method').value;
            applySearch();
        });
        document.getElementById('btn-reset').addEventListener('click', () => {
            _search = { q: '', method: '' };
            document.getElementById('sf-q').value = '';
            document.getElementById('sf-method').value = '';
            applySearch();
        });
        document.getElementById('btn-export').addEventListener('click', exportAudit);
        document.getElementById('sf-q').addEventListener('keydown', e => {
            if (e.key === 'Enter') document.getElementById('btn-search').click();
        });
    }

    function applySearch() {
        const q = _search.q.trim().toLowerCase();
        _filtered = entries.filter(a => {
            if (q) {
                const hay = `${a.name || ''} ${a.email || ''} ${a.username || ''}`.toLowerCase();
                if (!hay.includes(q)) return false;
            }
            if (_search.method && a.method !== _search.method) return false;
            return true;
        });
        _page = 1;
        renderTable();
    }

    function renderTable() {
        const pageRows = window.__amrd.paginate(_filtered, _page, PAGE_SIZE);
        document.getElementById('audit-tbody').innerHTML = pageRows.length ? pageRows.map(a => `
            <tr>
                <td>${fmtDateTime(a.logged_in_at)}</td>
                <td style="font-weight:600">${a.name || '—'}</td>
                <td style="color:#64748b">${a.email || '—'}</td>
                <td>
                    <span class="amrd-badge" style="${a.method === 'google' ? 'background:#dbeafe;color:#1d4ed8' : 'background:#f0fdf4;color:#15803d'}">
                        ${a.method === 'google' ? 'Google' : 'Password'}
                    </span>
                </td>
                <td style="color:#64748b;font-family:monospace;font-size:12px">${a.ip_address || '—'}</td>
            </tr>`).join('') : '<tr><td colspan="5" style="color:#94a3b8;text-align:center;padding:24px">No login activity found</td></tr>';

        document.getElementById('audit-count').textContent = `${_filtered.length} login event${_filtered.length !== 1 ? 's' : ''}`;
        window.__amrd.renderPagination(document.getElementById('audit-pagination'), {
            page: _page, pageSize: PAGE_SIZE, total: _filtered.length,
            onChange: (p) => { _page = p; renderTable(); },
        });
    }

    function exportAudit() {
        window.__amrd.exportCsv('login-audit.csv', _filtered, columns);
    }

    load();
    try {
        await fetchAll();
        applySearch();
    } catch (e) {
        root.innerHTML += `<p style="color:#dc2626;padding:20px">Failed to load login audit data: ${e.message}</p>`;
    }
});
</script>
</body>
</html>
