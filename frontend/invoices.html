<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
  <title>Invoices — AmaraData Platform</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="/js/platform.js"></script>
</head>
<body>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
        const root = window.__amrd.renderSidebar('Invoices');
        const fmt  = (v, currency) => new Intl.NumberFormat(undefined, currency ? { style: 'currency', currency, maximumFractionDigits: 0 } : { maximumFractionDigits: 0 }).format(Number(v));
        const fmtDate = d => d ? new Date(d).toLocaleDateString('en-US', { month: 'short', day: '2-digit', year: 'numeric' }) : '—';

        const PAGE_SIZE = 20;
        let _myTenants = [];
        let _allInvoices = [];
        let _filtered     = [];
        let _page         = 1;
        let _search = { number: '', tenantId: '', status: '', period: '' };

        const tr = await window.__amrd.apiFetch('/api/tenants/mine');
        _myTenants = tr.data || [];

        function tenantOptions(selected) {
            return `<option value="">All Tenants</option>
                ${_myTenants.map(t => `<option value="${t.id}"${selected==t.id?' selected':''}>${t.name}</option>`).join('')}`;
        }

        // invoice_number and period aren't supported server-side by the
        // GraphQL resolver — applied client-side on top of the
        // status/tenant_id server fetch.
        function applyClientFilters() {
            const num    = _search.number.trim().toLowerCase();
            const period = _search.period.trim();
            _filtered = _allInvoices.filter(i =>
                (!num    || i.invoice_number.toLowerCase().includes(num)) &&
                (!period || (i.period_year && `${i.period_year}-${String(i.period_month).padStart(2,'0')}`.startsWith(period)))
            );
            _page = 1;
            renderTable();
        }

        async function runSearch() {
            const gql = await window.__amrd.gqlFetch(
                `query($status: String, $tenant_id: ID) { invoices(status: $status, tenant_id: $tenant_id) { id invoice_number tenant_name period_year period_month total_amount due_date status } }`,
                { status: _search.status || null, tenant_id: _search.tenantId || null }
            );
            _allInvoices = gql?.invoices || [];
            applyClientFilters();
        }

        function resetSearch() {
            _search = { number: '', tenantId: '', status: '', period: '' };
            document.getElementById('sf-number').value = '';
            document.getElementById('sf-tenant').value = '';
            document.getElementById('sf-status').value = '';
            document.getElementById('sf-period').value = '';
            runSearch();
        }

        function renderTable() {
            const tbody = document.getElementById('invoices-tbody');
            const pageRows = window.__amrd.paginate(_filtered, _page, PAGE_SIZE);
            tbody.innerHTML = pageRows.map(i => `
                <tr>
                    <td><strong>${i.invoice_number}</strong></td>
                    <td>${i.tenant_name}</td>
                    <td>${i.period_year ? `${i.period_year}-${String(i.period_month).padStart(2,'0')}` : '—'}</td>
                    <td>${fmt(i.total_amount, i.currency_code)}</td>
                    <td>${fmtDate(i.due_date)}</td>
                    <td><span class="amrd-badge amrd-badge-${i.status}">${i.status}</span></td>
                    <td style="display:flex;gap:6px">
                        ${window.__amrd.isReadOnly() ? '' : (i.status === 'draft' ? `<button class="amrd-btn amrd-btn-ghost amrd-btn-sm" onclick="setStatus(${i.id},'sent')">Send</button>` : '')}
                        ${window.__amrd.isReadOnly() ? '' : (i.status === 'sent'  ? `<button class="amrd-btn amrd-btn-ghost amrd-btn-sm" onclick="setStatus(${i.id},'paid')">Mark Paid</button>` : '')}
                    </td>
                </tr>`).join('') || `<tr><td colspan="7" style="color:#94a3b8;text-align:center;padding:24px">No invoices${_allInvoices.length ? ' match your search' : ''}</td></tr>`;
            document.getElementById('invoices-count').textContent = `${_filtered.length} invoice(s)`;
            window.__amrd.renderPagination(document.getElementById('invoices-pagination'), {
                page: _page, pageSize: PAGE_SIZE, total: _filtered.length,
                onChange: (p) => { _page = p; renderTable(); },
            });
        }

        function exportInvoices() {
            window.__amrd.exportCsv('invoices.csv', _filtered, [
                { key: 'invoice_number', label: 'Invoice #' },
                { key: 'tenant_name',    label: 'Tenant' },
                { key: 'period_year',    label: 'Period Year' },
                { key: 'period_month',   label: 'Period Month' },
                { key: 'total_amount',   label: 'Total' },
                { key: 'due_date',       label: 'Due Date' },
                { key: 'status',         label: 'Status' },
            ]);
        }

        async function load() {
            root.innerHTML = `
                <div class="amrd-card">
                    <div class="amrd-search-bar">
                        <div class="amrd-search-field"><label>Invoice #</label><input id="sf-number" placeholder="Search invoice #…"></div>
                        <div class="amrd-search-field">
                            <label>Tenant</label>
                            <select id="sf-tenant">${tenantOptions('')}</select>
                        </div>
                        <div class="amrd-search-field">
                            <label>Status</label>
                            <select id="sf-status">
                                <option value="">All</option>
                                ${['draft','sent','paid','overdue'].map(s => `<option value="${s}">${s}</option>`).join('')}
                            </select>
                        </div>
                        <div class="amrd-search-field"><label>Period</label><input id="sf-period" placeholder="YYYY-MM"></div>
                        <div class="amrd-search-actions">
                            <button class="amrd-btn amrd-btn-primary" id="btn-search">Search</button>
                            <button class="amrd-btn amrd-btn-ghost" id="btn-reset">Reset</button>
                        </div>
                    </div>
                </div>
                <div class="amrd-toolbar">
                    <span id="invoices-count" style="color:#64748b;font-size:13px"></span>
                    <div style="display:flex;gap:8px">
                        <button class="amrd-btn amrd-btn-ghost" id="btn-export">⬇ Export CSV</button>
                        ${window.__amrd.isReadOnly() ? '' : '<button class="amrd-btn amrd-btn-primary" onclick="openForm()">+ New Invoice</button>'}
                    </div>
                </div>
                <div class="amrd-card" style="padding:0">
                    <div class="amrd-table-wrap">
                    <table class="amrd-table">
                        <thead><tr><th>Invoice #</th><th>Tenant</th><th>Period</th><th>Total</th><th>Due</th><th>Status</th><th></th></tr></thead>
                        <tbody id="invoices-tbody"></tbody>
                    </table>
                    </div>
                    <div id="invoices-pagination"></div>
                </div>
                <div id="form-slot"></div>`;

            document.getElementById('btn-search').addEventListener('click', () => {
                _search = {
                    number:   document.getElementById('sf-number').value,
                    tenantId: document.getElementById('sf-tenant').value,
                    status:   document.getElementById('sf-status').value,
                    period:   document.getElementById('sf-period').value,
                };
                runSearch();
            });
            document.getElementById('btn-reset').addEventListener('click', resetSearch);
            document.getElementById('btn-export').addEventListener('click', exportInvoices);
            ['sf-number', 'sf-period'].forEach(id =>
                document.getElementById(id).addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('btn-search').click(); })
            );

            await runSearch();
        }

        async function openForm() {
            const today = new Date().toISOString().slice(0,10);
            const due   = new Date(Date.now() + 15*86400000).toISOString().slice(0,10);
            const slot  = document.getElementById('form-slot');
            slot.innerHTML = `
                <div class="amrd-card">
                    <h3>New Invoice</h3>
                    <div class="amrd-form-row">
                        <div><label>Tenant *</label>
                            <select id="f-tenant">
                                <option value="">-- Select --</option>
                                ${_myTenants.map(t=>`<option value="${t.id}">${t.name}</option>`).join('')}
                            </select>
                        </div>
                        <div><label>Billing Period</label>
                            <input id="f-period" placeholder="YYYY-MM (optional)">
                        </div>
                    </div>
                    <div class="amrd-form-row">
                        <div><label>Issue Date *</label><input id="f-issue" type="date" value="${today}"></div>
                        <div><label>Due Date *</label><input id="f-due" type="date" value="${due}"></div>
                    </div>
                    <div id="lines-wrap">
                        <h4 style="font-size:13px;margin:16px 0 8px">Line Items</h4>
                        <div id="lines"></div>
                        <button class="amrd-btn amrd-btn-ghost amrd-btn-sm" style="margin-top:8px" onclick="addLine()">+ Add Line</button>
                    </div>
                    <div class="amrd-form-row full" style="margin-top:14px"><div><label>Notes</label><textarea id="f-notes" rows="2"></textarea></div></div>
                    <div style="margin-top:16px;display:flex;gap:10px">
                        <button class="amrd-btn amrd-btn-primary" onclick="saveInvoice()">Create Invoice</button>
                        <button class="amrd-btn amrd-btn-ghost" onclick="document.getElementById('form-slot').innerHTML=''">Cancel</button>
                    </div>
                    <div id="inv-err" style="color:#dc2626;font-size:13px;margin-top:8px"></div>
                </div>`;
            addLine();
        }

        let lineCount = 0;
        function addLine() {
            const n = lineCount++;
            const wrap = document.createElement('div');
            wrap.style.cssText = 'display:grid;grid-template-columns:2fr 1fr 1fr 1fr auto;gap:8px;margin-bottom:8px;align-items:end';
            wrap.innerHTML = `
                <div><label>Description</label><input id="ld-${n}" placeholder="e.g. Sales commission (2 units)"></div>
                <div><label>Type</label><select id="lt-${n}">
                    <option value="sales_pct">Sales %</option>
                    <option value="rental_pct">Rental %</option>
                    <option value="hourly">Hourly</option>
                    <option value="milestone">Milestone</option>
                    <option value="fixed">Fixed</option>
                </select></div>
                <div><label>Qty</label><input id="lq-${n}" type="number" value="1" min="0" step="0.01"></div>
                <div><label>Unit Price</label><input id="lp-${n}" type="number" value="0" min="0" step="0.01"></div>
                <div><button class="amrd-btn amrd-btn-ghost amrd-btn-sm" style="margin-top:18px" onclick="this.closest('div').remove()">✕</button></div>`;
            document.getElementById('lines').appendChild(wrap);
        }

        async function saveInvoice() {
            const lines = [];
            document.getElementById('lines').querySelectorAll('input[id^="ld-"]').forEach(el => {
                const n = el.id.split('-')[1];
                const qty = parseFloat(document.getElementById('lq-'+n)?.value||1);
                const up  = parseFloat(document.getElementById('lp-'+n)?.value||0);
                lines.push({
                    description: el.value,
                    billing_type: document.getElementById('lt-'+n)?.value,
                    quantity: qty, unit_price: up, amount: +(qty*up).toFixed(2),
                });
            });
            const period = document.getElementById('f-period').value;
            const [py, pm] = period ? period.split('-') : [null, null];
            try {
                await window.__amrd.apiFetch('/api/invoices', {
                    method: 'POST',
                    body: JSON.stringify({
                        tenant_id:    document.getElementById('f-tenant').value,
                        period_year:  py ? parseInt(py) : null,
                        period_month: pm ? parseInt(pm) : null,
                        issue_date:   document.getElementById('f-issue').value,
                        due_date:     document.getElementById('f-due').value,
                        notes:        document.getElementById('f-notes').value,
                        line_items:   lines,
                    }),
                });
                document.getElementById('form-slot').innerHTML = '';
                await runSearch();
            } catch (e) {
                document.getElementById('inv-err').textContent = e.message;
            }
        }

        async function setStatus(id, status) {
            await window.__amrd.apiFetch(`/api/invoices/${id}/status`, {
                method: 'PATCH', body: JSON.stringify({ status }),
            });
            await runSearch();
        }

        window.openForm        = openForm;
        window.addLine         = addLine;
        window.saveInvoice     = saveInvoice;
        window.setStatus       = setStatus;

        await load();
    });
  </script>
</body>
</html>
