<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
  <title>Billing Metrics — AmaraData Platform</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="/js/platform.js"></script>
</head>
<body>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
        const root = window.__amrd.renderSidebar('Billing Metrics');
        const fmt  = v => new Intl.NumberFormat(undefined, { maximumFractionDigits: 0 }).format(Number(v));
        const now  = new Date();

        let _myTenants = [];
        let _rows      = [];
        let _page      = 1;
        const PAGE_SIZE = 20;
        let _search = { year: now.getFullYear(), month: now.getMonth() + 1, tenantId: '' };

        const tr = await window.__amrd.apiFetch('/api/tenants/mine');
        _myTenants = tr.data || [];

        const columns = [
            { key: 'tenant_name',       label: 'Tenant' },
            { key: 'sales_count',       label: 'Sales (count)' },
            { key: 'sales_value',       label: 'Sales Value' },
            { key: 'rental_units',      label: 'Rental Units' },
            { key: 'rental_income',     label: 'Rental Income' },
            { key: 'active_properties', label: 'Active Props' },
            { key: 'collected_at',      label: 'Collected' },
        ];

        function load() {
            root.innerHTML = `
                <div class="amrd-search-bar">
                    <div class="amrd-search-field">
                        <label>Year</label>
                        <input id="sf-year" type="number" value="${_search.year}">
                    </div>
                    <div class="amrd-search-field">
                        <label>Month</label>
                        <input id="sf-month" type="number" min="1" max="12" value="${_search.month}">
                    </div>
                    <div class="amrd-search-field">
                        <label>Tenant</label>
                        <select id="sf-tenant">
                            <option value="">All Tenants</option>
                            ${_myTenants.map(t => `<option value="${t.id}"${_search.tenantId == t.id ? ' selected' : ''}>${t.name}</option>`).join('')}
                        </select>
                    </div>
                    <div class="amrd-search-actions">
                        <button class="amrd-btn amrd-btn-primary amrd-btn-sm" id="btn-search">Search</button>
                        <button class="amrd-btn amrd-btn-ghost amrd-btn-sm" id="btn-reset">Reset</button>
                    </div>
                </div>
                <div class="amrd-toolbar">
                    <span id="metrics-count" style="font-size:13px;color:#64748b"></span>
                    <div style="display:flex;gap:8px">
                        <button class="amrd-btn amrd-btn-ghost amrd-btn-sm" id="btn-export">Export CSV</button>
                        ${window.__amrd.isReadOnly() ? '' : `<button class="amrd-btn amrd-btn-ghost amrd-btn-sm" onclick="openManual()">+ Manual Entry</button>`}
                    </div>
                </div>
                <div class="amrd-card" style="padding:0">
                    <div class="amrd-table-wrap">
                    <table class="amrd-table">
                        <thead><tr><th>Tenant</th><th>Sales (count)</th><th>Sales Value</th><th>Rental Units</th><th>Rental Income</th><th>Active Props</th><th>Collected</th></tr></thead>
                        <tbody id="metrics-tbody"></tbody>
                    </table>
                    </div>
                </div>
                <div id="metrics-pagination"></div>
                <div id="form-slot"></div>`;

            document.getElementById('btn-search').addEventListener('click', () => {
                _search.year     = parseInt(document.getElementById('sf-year').value)  || now.getFullYear();
                _search.month    = parseInt(document.getElementById('sf-month').value) || (now.getMonth() + 1);
                _search.tenantId = document.getElementById('sf-tenant').value;
                runSearch();
            });
            document.getElementById('btn-reset').addEventListener('click', () => {
                _search = { year: now.getFullYear(), month: now.getMonth() + 1, tenantId: '' };
                document.getElementById('sf-year').value   = _search.year;
                document.getElementById('sf-month').value  = _search.month;
                document.getElementById('sf-tenant').value = '';
                runSearch();
            });
            document.getElementById('btn-export').addEventListener('click', exportMetrics);
            ['sf-year', 'sf-month'].forEach(id => {
                document.getElementById(id).addEventListener('keydown', e => {
                    if (e.key === 'Enter') document.getElementById('btn-search').click();
                });
            });
        }

        async function runSearch() {
            const gql = await window.__amrd.gqlFetch(
                `query($year: Int, $month: Int, $tenant_id: ID) {
                    billingMetrics(year: $year, month: $month, tenant_id: $tenant_id) { id tenant_id tenant_name period_year period_month sales_count sales_value rental_units rental_income active_properties collected_at }
                }`,
                { year: _search.year, month: _search.month, tenant_id: _search.tenantId || null }
            );
            const metrics = gql?.billingMetrics || [];
            const viewTenants = _search.tenantId
                ? _myTenants.filter(t => t.id == _search.tenantId)
                : _myTenants;

            _rows = viewTenants.map(t => {
                const m = metrics.find(x => x.tenant_id == t.id);
                return {
                    tenant_name: t.name,
                    sales_count: m ? m.sales_count : '',
                    sales_value: m ? m.sales_value : '',
                    rental_units: m ? m.rental_units : '',
                    rental_income: m ? m.rental_income : '',
                    active_properties: m ? m.active_properties : '',
                    collected_at: m && m.collected_at ? new Date(m.collected_at).toLocaleDateString('en-US', { month: 'short', day: '2-digit', year: 'numeric' }) : '',
                    _hasData: !!m,
                };
            });
            _page = 1;
            renderTable();
        }

        function renderTable() {
            const tbody = document.getElementById('metrics-tbody');
            const pageRows = window.__amrd.paginate(_rows, _page, PAGE_SIZE);
            tbody.innerHTML = pageRows.map(r => {
                if (!r._hasData) return `<tr><td>${r.tenant_name}</td><td colspan="6" style="color:#94a3b8;font-style:italic">No data for this period</td></tr>`;
                return `<tr>
                    <td><strong>${r.tenant_name}</strong></td>
                    <td>${r.sales_count}</td>
                    <td>${fmt(r.sales_value)}</td>
                    <td>${r.rental_units}</td>
                    <td>${fmt(r.rental_income)}</td>
                    <td>${r.active_properties}</td>
                    <td style="color:#94a3b8;font-size:11px">${r.collected_at || '—'}</td>
                </tr>`;
            }).join('') || '<tr><td colspan="7" style="color:#94a3b8;text-align:center;padding:24px">No tenants configured</td></tr>';

            document.getElementById('metrics-count').textContent = `${_rows.length} tenant(s)`;
            window.__amrd.renderPagination(document.getElementById('metrics-pagination'), {
                page: _page, pageSize: PAGE_SIZE, total: _rows.length,
                onChange: (p) => { _page = p; renderTable(); },
            });
        }

        function exportMetrics() {
            window.__amrd.exportCsv('billing-metrics.csv', _rows, columns);
        }

        function openManual() {
            if (window.__amrd.isReadOnly()) return;
            const now  = new Date();
            const slot = document.getElementById('form-slot');
            slot.innerHTML = `
                <div class="amrd-card">
                    <h3>Manual Metric Entry</h3>
                    <div class="amrd-form-row">
                        <div><label>Tenant *</label>
                            <select id="f-tenant">
                                <option value="">-- Select --</option>
                                ${_myTenants.map(t=>`<option value="${t.id}">${t.name}</option>`).join('')}
                            </select>
                        </div>
                        <div><label>Year *</label><input id="f-year2" type="number" value="${now.getFullYear()}"></div>
                    </div>
                    <div class="amrd-form-row">
                        <div><label>Month *</label><input id="f-month2" type="number" min="1" max="12" value="${now.getMonth()||12}"></div>
                        <div><label>Active Properties</label><input id="f-ap" type="number" value="0"></div>
                    </div>
                    <div class="amrd-form-row">
                        <div><label>Sales Count</label><input id="f-sc" type="number" value="0"></div>
                        <div><label>Sales Value</label><input id="f-sv" type="number" value="0"></div>
                    </div>
                    <div class="amrd-form-row">
                        <div><label>Rental Units</label><input id="f-ru" type="number" value="0"></div>
                        <div><label>Rental Income</label><input id="f-ri" type="number" value="0"></div>
                    </div>
                    <div style="margin-top:16px;display:flex;gap:10px">
                        <button class="amrd-btn amrd-btn-primary" onclick="saveMetric()">Save</button>
                        <button class="amrd-btn amrd-btn-ghost" onclick="document.getElementById('form-slot').innerHTML=''">Cancel</button>
                    </div>
                    <div id="save-err" style="color:#dc2626;font-size:13px;margin-top:8px"></div>
                </div>`;
        }

        async function saveMetric() {
            try {
                await window.__amrd.apiFetch('/api/metrics', {
                    method: 'POST',
                    body: JSON.stringify({
                        tenant_id:        document.getElementById('f-tenant').value,
                        period_year:      parseInt(document.getElementById('f-year2').value),
                        period_month:     parseInt(document.getElementById('f-month2').value),
                        sales_count:      parseInt(document.getElementById('f-sc').value)||0,
                        sales_value:      parseFloat(document.getElementById('f-sv').value)||0,
                        rental_units:     parseInt(document.getElementById('f-ru').value)||0,
                        rental_income:    parseFloat(document.getElementById('f-ri').value)||0,
                        active_properties: parseInt(document.getElementById('f-ap').value)||0,
                    }),
                });
                document.getElementById('form-slot').innerHTML = '';
                await runSearch();
            } catch (e) {
                document.getElementById('save-err').textContent = e.message;
            }
        }

        window.openManual = openManual;
        window.saveMetric = saveMetric;

        load();
        await runSearch();
    });
  </script>
</body>
</html>
