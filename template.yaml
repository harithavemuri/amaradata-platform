AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: AmaraData Platform — tenant billing & management

# ─── Pre-deploy checklist ──────────────────────────────────────────────────────
#
# Secrets Manager  (actual credentials — 4 values)
#   aws secretsmanager put-secret-value \
#     --secret-id /amaradata/prod/jwt-secret          --secret-string "<random 64-char string>"
#   aws secretsmanager put-secret-value \
#     --secret-id /amaradata/prod/google-client-secret --secret-string "<from GCP Console>"
#   aws secretsmanager put-secret-value \
#     --secret-id /amaradata/prod/db-write-password   --secret-string "<password>"
#   aws secretsmanager put-secret-value \
#     --secret-id /amaradata/prod/db-read-password    --secret-string "<password>"
#
# SSM Parameter Store  (config — not credentials)
#   aws ssm put-parameter --name /amaradata/prod/google-client-id  --type String --value "<from GCP Console>"
#   aws ssm put-parameter --name /amaradata/prod/google-redirect-uri --type String --value "https://amaradata.com/api/auth/google/callback"
#   aws ssm put-parameter --name /amaradata/prod/db-host           --type String --value "<amaradata cluster writer endpoint>"
#   aws ssm put-parameter --name /amaradata/prod/db-write-user     --type String --value "<username>"
#   aws ssm put-parameter --name /amaradata/prod/db-read-user      --type String --value "<username>"
#
# Shared Aurora cluster (CreateDbCluster=false, default)
#   1. CREATE DATABASE amaradata_platform  on the amaradata cluster
#   2. Run database/schema.sql against amaradata_platform
#   3. Set /amaradata/prod/db-host to the amaradata cluster writer endpoint
#
# ─── SES inbound + Lambda email forwarding (rajas@amaradata.com → Gmail) ────────
# Deploy the email/ stack first (us-east-1), then follow these steps.
#
#   1. Deploy the email forwarder stack:
#        cd email && sam build && sam deploy
#
#   2. Activate the SES receipt rule set (one-time):
#        aws ses set-active-receipt-rule-set --rule-set-name amrd-inbound --region us-east-1
#
#   3. Create SES SMTP credentials for Gmail "Send mail as":
#        AWS Console → SES (ap-south-1) → SMTP settings → Create SMTP credentials
#
#   4. Configure Gmail to send/reply as rajas@amaradata.com:
#        Gmail → Settings → Accounts → "Send mail as" → Add another address
#        Name: Rajas   Email: rajas@amaradata.com   (uncheck "treat as alias")
#        SMTP server: email-smtp.ap-south-1.amazonaws.com   Port: 587   TLS
#        Username / Password: from step 3
#      Gmail sends a verification code to rajas@amaradata.com — the Lambda
#      forwards it to your Gmail inbox. Enter the code to confirm.

Parameters:
  Tenant:
    Type: String
    Default: amaradata

  Env:
    Type: String
    Default: prod
    AllowedValues: [prod, staging, qa, dev]

  FrontendUrl:
    Type: String
    Default: https://amaradata.com
    Description: Production URL (used for CORS and OAuth redirect URI)

  AcmCertificateArn:
    Type: String
    Default: ''
    Description: >
      ACM certificate ARN in us-east-1 for the CloudFront custom domain (amaradata.com).
      Leave empty to fall back to the default *.cloudfront.net certificate.

  CreateDbCluster:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: >
      false — share the amaradata Aurora cluster (default).
      true  — provision a dedicated Aurora Serverless v2 cluster.

  DbName:
    Type: String
    Default: amaradata_platform

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC for Aurora (same as rohas-group)

  VpcSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Two subnets in different AZs (same as rohas-group)

  SesFromEmail:
    Type: String
    Default: noreply@amaradata.com
    Description: >
      SES sender address — must be within the verified amaradata.com domain.
      Store as /shared/<env>/ses-from-email in SSM so rohas and other tenant stacks can read it.

  HostedZoneId:
    Type: AWS::Route53::HostedZone::Id
    Description: Route 53 hosted zone ID for amaradata.com (used to add SES DKIM, DMARC, and ImprovMX records automatically).

  # ── Cost allocation tags ──────────────────────────────────────────────────────
  TagApplication:
    Type: String
    Default: tenant-billing
  TagProject:
    Type: String
    Default: amaradata

Conditions:
  ShouldCreateDb:  !Equals [!Ref CreateDbCluster, 'true']
  HasCustomDomain: !Not [!Equals [!Ref AcmCertificateArn, '']]
  IsProd:          !Equals [!Ref Env, 'prod']

Globals:
  Function:
    Runtime: nodejs22.x
    Architectures: [arm64]
    MemorySize: 512
    Timeout: 29
    LoggingConfig:
      LogFormat: JSON
      LogGroup: !Sub '${Tenant}-${Env}'
    Tags:
      tenant:      !Ref Tenant
      application: !Ref TagApplication
      project:     !Ref TagProject
      component:   shared
    Environment:
      Variables:
        # Structural config — plain values
        NODE_ENV:       !Ref Env
        AMRD_DB_NAME:   !Ref DbName
        AMRD_DB_PORT:   '5432'
        FRONTEND_URL:   !Ref FrontendUrl

        # Company & contact — customise per deployment
        COMPANY_NAME:      '{{resolve:ssm:/amaradata/prod/company-name}}'
        COMPANY_TAGLINE:   '{{resolve:ssm:/amaradata/prod/company-tagline}}'
        CONTACT_EMAIL:     '{{resolve:ssm:/amaradata/prod/contact-email}}'
        CONTACT_PHONE:     '{{resolve:ssm:/amaradata/prod/contact-phone}}'
        CONTACT_ADDRESS:   '{{resolve:ssm:/amaradata/prod/contact-address}}'
        SUPPORT_EMAIL:     '{{resolve:ssm:/amaradata/prod/support-email}}'
        COPYRIGHT_YEAR:    '{{resolve:ssm:/amaradata/prod/copyright-year}}'

        # SSM Parameter Store — config, not credentials
        GOOGLE_CLIENT_ID:    !Sub '{{resolve:ssm:/${Tenant}/${Env}/google-client-id}}'
        GOOGLE_REDIRECT_URI: !Sub '{{resolve:ssm:/${Tenant}/${Env}/google-redirect-uri}}'
        AMRD_DB_HOST:        !Sub '{{resolve:ssm:/${Tenant}/${Env}/db-host}}'
        AMRD_DB_WRITE_USER:  !Sub '{{resolve:ssm:/${Tenant}/${Env}/db-write-user}}'
        AMRD_DB_READ_USER:   !Sub '{{resolve:ssm:/${Tenant}/${Env}/db-read-user}}'

        # Secrets Manager — actual credentials
        AMRD_JWT_SECRET:        !Sub '{{resolve:secretsmanager:/${Tenant}/${Env}/jwt-secret}}'
        GOOGLE_CLIENT_SECRET:   !Sub '{{resolve:secretsmanager:/${Tenant}/${Env}/google-client-secret}}'
        AMRD_DB_WRITE_PASSWORD: !Sub '{{resolve:secretsmanager:/${Tenant}/${Env}/db-write-password}}'
        AMRD_DB_READ_PASSWORD:  !Sub '{{resolve:secretsmanager:/${Tenant}/${Env}/db-read-password}}'
        ORIGIN_SECRET:          !Sub '{{resolve:secretsmanager:/${Tenant}/${Env}/origin-secret}}'
        SSO_SECRET:             !Sub '{{resolve:secretsmanager:/shared/${Env}/sso-secret}}'
        ROHAS_URL:              !Sub '{{resolve:ssm:/rohas/${Env}/frontend-url}}'
        PASSWORD_EXPIRY_DAYS:   '365'
        SES_FROM_EMAIL:         !Ref SesFromEmail
        EMAIL_BUCKET:           !Sub 'amrd-email-inbound-${AWS::AccountId}'
        EMAIL_INBOX_FROM:       rajas@amaradata.com

Resources:

  # ── CloudWatch Log Group — one consolidated group per application ─────────────
  AppLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '${Tenant}-${Env}'
      RetentionInDays: !If [IsProd, 30, 7]
      Tags:
        - { Key: tenant,      Value: !Ref Tenant }
        - { Key: application, Value: !Ref TagApplication }
        - { Key: project,     Value: !Ref TagProject }
        - { Key: component,   Value: shared }

  # ── HTTP API Gateway ──────────────────────────────────────────────────────────
  AmrdApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Env
      Tags:
        tenant:      !Ref Tenant
        application: !Ref TagApplication
        project:     !Ref TagProject
        component:   shared
      CorsConfiguration:
        AllowOrigins:
          - !Ref FrontendUrl
        AllowHeaders:
          - Content-Type
          - Authorization
          - Accept
        AllowMethods:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
          - OPTIONS
        AllowCredentials: true
        MaxAge: 600
      # Tightened from the API Gateway account default (100 req/sec sustained,
      # 200 burst) — real traffic here is a light admin tool + one tenant, well
      # under this ceiling; this just shrinks how far a flood could push before
      # API Gateway itself starts rejecting requests, at no extra cost.
      RouteSettings:
        $default:
          ThrottlingRateLimit: 20
          ThrottlingBurstLimit: 40

  # ── API Lambda — Express app (all routes) ─────────────────────────────────────
  ApiFn:
    Type: AWS::Serverless::Function
    DependsOn: AppLogGroup
    Properties:
      FunctionName: !Sub '${Tenant}-${Env}-api'
      Handler: backend/lambda/api.handler
      CodeUri: .
      MemorySize: 1024
      Policies:
        - Statement:
            - Effect: Allow
              Action: ses:SendEmail
              Resource: !Sub 'arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/amaradata.com'
            - Effect: Allow
              Action: ses:SendRawEmail
              Resource:
                - !Sub 'arn:aws:ses:us-east-1:${AWS::AccountId}:identity/amaradata.com'
                - !Sub 'arn:aws:ses:us-east-1:${AWS::AccountId}:identity/rajvemuri25@gmail.com'
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:ListBucket
              Resource:
                - !Sub 'arn:aws:s3:::amrd-email-inbound-${AWS::AccountId}'
                - !Sub 'arn:aws:s3:::amrd-email-inbound-${AWS::AccountId}/*'
      Events:
        ApiProxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref AmrdApi
            Path: /api/{proxy+}
            Method: ANY
        GraphQL:
          Type: HttpApi
          Properties:
            ApiId: !Ref AmrdApi
            Path: /graphql
            Method: ANY
        Health:
          Type: HttpApi
          Properties:
            ApiId: !Ref AmrdApi
            Path: /health
            Method: GET

  # ── CloudFront URL rewrite — extensionless paths → .html for S3 ───────────────
  UrlRewriteFn:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub '${Tenant}-${Env}-url-rewrite'
      AutoPublish: true
      FunctionConfig:
        Comment: Rewrite extensionless paths to .html for S3 origin
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var uri = event.request.uri;
          if (!uri.includes('.') && uri !== '/' &&
              !uri.startsWith('/api/') && uri !== '/graphql' && uri !== '/health') {
            event.request.uri = uri + '.html';
          }
          return event.request;
        }

  # ── S3 + CloudFront — frontend static files ───────────────────────────────────
  OAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${Tenant}-${Env}-oac'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'amrd-platform-${Tenant}-${Env}-${AWS::AccountId}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - { Key: tenant,      Value: !Ref Tenant }
        - { Key: application, Value: !Ref TagApplication }
        - { Key: project,     Value: !Ref TagProject }
        - { Key: component,   Value: shared }

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${FrontendBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}'

  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      Tags:
        - { Key: tenant,      Value: !Ref Tenant }
        - { Key: application, Value: !Ref TagApplication }
        - { Key: project,     Value: !Ref TagProject }
        - { Key: component,   Value: shared }
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        HttpVersion: http2
        PriceClass: PriceClass_100
        Restrictions:
          GeoRestriction:
            RestrictionType: whitelist
            Locations: [IN, AE, US]   # India, UAE, USA — free CloudFront-native geo allow-list
        Aliases: !If
          - HasCustomDomain
          - - !Select [1, !Split ['://', !Ref FrontendUrl]]
            - !Sub
              - 'www.${d}'
              - d: !Select [1, !Split ['://', !Ref FrontendUrl]]
          - !Ref AWS::NoValue
        ViewerCertificate: !If
          - HasCustomDomain
          - AcmCertificateArn: !Ref AcmCertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            S3OriginConfig: {}
            OriginAccessControlId: !GetAtt OAC.Id
          - Id: ApiOrigin
            DomainName: !Sub '${AmrdApi}.execute-api.${AWS::Region}.amazonaws.com'
            OriginPath: !Sub '/${Env}'
            CustomOriginConfig:
              HTTPSPort: 443
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
            OriginCustomHeaders:
              - HeaderName: x-origin-secret
                HeaderValue: !Sub '{{resolve:secretsmanager:/${Tenant}/${Env}/origin-secret}}'
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6   # CachingOptimized
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: true
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt UrlRewriteFn.FunctionARN
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: ApiOrigin
            ViewerProtocolPolicy: redirect-to-https
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad           # CachingDisabled
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac    # AllViewerExceptHostHeader
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachedMethods: [GET, HEAD]
          - PathPattern: /graphql
            TargetOriginId: ApiOrigin
            ViewerProtocolPolicy: redirect-to-https
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachedMethods: [GET, HEAD]
          - PathPattern: /health
            TargetOriginId: ApiOrigin
            ViewerProtocolPolicy: redirect-to-https
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
            AllowedMethods: [GET, HEAD]
            CachedMethods: [GET, HEAD]
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /login.html
            ErrorCachingMinTTL: 0
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /login.html
            ErrorCachingMinTTL: 0

  # ── Aurora Serverless v2 — conditional on CreateDbCluster=true ────────────────
  DBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Condition: ShouldCreateDb
    Properties:
      GroupDescription: !Sub '${Tenant}-${Env} Aurora PostgreSQL'
      VpcId: !Ref VpcId
      SecurityGroupIngress: []   # No public access — Lambda uses general AWS IPs; add home IP manually for pgAdmin
      Tags:
        - { Key: tenant,      Value: !Ref Tenant }
        - { Key: application, Value: !Ref TagApplication }
        - { Key: project,     Value: !Ref TagProject }
        - { Key: component,   Value: shared }

  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Condition: ShouldCreateDb
    Properties:
      DBSubnetGroupDescription: !Sub '${Tenant}-${Env} Aurora subnet group'
      SubnetIds: !Ref VpcSubnetIds
      Tags:
        - { Key: tenant,      Value: !Ref Tenant }
        - { Key: application, Value: !Ref TagApplication }
        - { Key: project,     Value: !Ref TagProject }
        - { Key: component,   Value: shared }

  DBCluster:
    Type: AWS::RDS::DBCluster
    Condition: ShouldCreateDb
    DeletionPolicy: Snapshot
    Properties:
      DBClusterIdentifier: !Ref Tenant
      Engine: aurora-postgresql
      EngineVersion: '17.7'
      AllowMajorVersionUpgrade: true
      DatabaseName: !Ref DbName
      MasterUsername:     !Sub '{{resolve:ssm:/${Tenant}/${Env}/db-write-user}}'
      MasterUserPassword: !Sub '{{resolve:secretsmanager:/${Tenant}/${Env}/db-write-password}}'
      DBSubnetGroupName: !Ref DBSubnetGroup
      VpcSecurityGroupIds:
        - !GetAtt DBSecurityGroup.GroupId
      ServerlessV2ScalingConfiguration:
        MinCapacity: 0
        MaxCapacity: 4
      StorageEncrypted: true
      BackupRetentionPeriod: 7
      DeletionProtection: true
      Tags:
        - { Key: tenant,      Value: !Ref Tenant }
        - { Key: application, Value: !Ref TagApplication }
        - { Key: project,     Value: !Ref TagProject }
        - { Key: component,   Value: shared }

  DBInstance:
    Type: AWS::RDS::DBInstance
    Condition: ShouldCreateDb
    Properties:
      DBClusterIdentifier: !Ref DBCluster
      DBInstanceClass: db.serverless
      Engine: aurora-postgresql
      PubliclyAccessible: false
      Tags:
        - { Key: tenant,      Value: !Ref Tenant }
        - { Key: application, Value: !Ref TagApplication }
        - { Key: project,     Value: !Ref TagProject }
        - { Key: component,   Value: shared }

  DBInitFn:
    Type: AWS::Serverless::Function
    Condition: ShouldCreateDb
    DependsOn: [DBInstance, AppLogGroup]
    Properties:
      FunctionName: !Sub '${Tenant}-${Env}-db-init'
      Handler: backend/lambda/db-init.handler
      CodeUri: .
      Timeout: 120

  DBInitResource:
    Type: AWS::CloudFormation::CustomResource
    Condition: ShouldCreateDb
    DependsOn: DBInitFn
    Properties:
      ServiceToken: !GetAtt DBInitFn.Arn
      ResourceVersion: '1'

  # ── DB migration — runs on every deploy via npm run deploy ───────────────────
  # Invoked explicitly after sam deploy (not a CF Custom Resource) so it always
  # runs regardless of whether the CF changeset touched this function.
  DBMigrateFn:
    Type: AWS::Serverless::Function
    DependsOn: AppLogGroup
    Properties:
      FunctionName: !Sub '${Tenant}-${Env}-db-migrate'
      Handler: backend/lambda/db-migrate.handler
      CodeUri: .
      Timeout: 120
      Policies:
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:/amaradata/aurora/*'
      Environment:
        Variables:
          DB_MASTER_SECRET_NAME: !Sub '/${Tenant}/aurora/master-password'
          DB_MASTER_USER: amararoot

  # ── SES — domain identity for amaradata.com ────────────────────────────────────
  # Verifies the entire amaradata.com domain so any @amaradata.com address can send.
  # CloudFormation generates 3 DKIM CNAME records; SesRoute53DkimRecords writes them
  # to Route 53 automatically. No manual DNS step required after deploy.
  SesDomainIdentity:
    Type: AWS::SES::EmailIdentity
    Properties:
      EmailIdentity: amaradata.com
      DkimAttributes:
        SigningEnabled: true
      FeedbackAttributes:
        EmailForwardingEnabled: true

  # DKIM CNAME records — added automatically to Route 53
  SesRoute53DkimRecords:
    Type: AWS::Route53::RecordSetGroup
    DependsOn: SesDomainIdentity
    Properties:
      HostedZoneId: !Ref HostedZoneId
      RecordSets:
        - Name: !Sub '${SesDomainIdentity.DkimDNSTokenName1}'
          Type: CNAME
          TTL: '1800'
          ResourceRecords:
            - !Sub '${SesDomainIdentity.DkimDNSTokenValue1}'
        - Name: !Sub '${SesDomainIdentity.DkimDNSTokenName2}'
          Type: CNAME
          TTL: '1800'
          ResourceRecords:
            - !Sub '${SesDomainIdentity.DkimDNSTokenValue2}'
        - Name: !Sub '${SesDomainIdentity.DkimDNSTokenName3}'
          Type: CNAME
          TTL: '1800'
          ResourceRecords:
            - !Sub '${SesDomainIdentity.DkimDNSTokenValue3}'

  # DMARC TXT record — instructs receiving servers to quarantine unauthenticated mail
  SesRoute53DmarcRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: _dmarc.amaradata.com.
      Type: TXT
      TTL: '3600'
      ResourceRecords:
        - '"v=DMARC1; p=quarantine; rua=mailto:dmarc-reports@amaradata.com; adkim=s; aspf=s"'

  # ── SES inbound — Route 53 DNS records ─────────────────────────────────────────
  # MX record — routes inbound email for amaradata.com to SES in us-east-1
  # (logical ID kept as WorkMailMxRecord to avoid a DELETE+CREATE conflict on the same physical record)
  WorkMailMxRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: amaradata.com.
      Type: MX
      TTL: '3600'
      ResourceRecords:
        - '10 inbound-smtp.us-east-1.amazonaws.com'

  # SPF TXT record — authorises SES for sending on behalf of amaradata.com
  WorkMailSpfRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: amaradata.com.
      Type: TXT
      TTL: '3600'
      ResourceRecords:
        - '"v=spf1 include:amazonses.com ~all"'

  # SSM — publish the SES from-email to /shared/<env>/ so rohas and other tenant stacks can read it
  SsmSharedSesFromEmail:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/shared/${Env}/ses-from-email'
      Type: String
      Value: !Ref SesFromEmail
      Description: Verified SES sender email — shared across all tenant stacks
      Tags:
        tenant:      !Ref Tenant
        application: !Ref TagApplication
        project:     !Ref TagProject
        component:   shared

Outputs:
  AppUrl:
    Description: CloudFront domain — point amaradata.com to this via Route 53 alias record; also ensure /amaradata/<env>/google-redirect-uri in SSM is set to https://amaradata.com/api/auth/google/callback
    Value: !Sub 'https://${CloudFrontDistribution.DomainName}'
  ApiGatewayUrl:
    Description: Raw API Gateway URL (for debugging; use AppUrl in production)
    Value: !Sub 'https://${AmrdApi}.execute-api.${AWS::Region}.amazonaws.com/${Env}'
  FrontendBucketName:
    Description: Upload frontend/ files here after sam deploy
    Value: !Ref FrontendBucket
  CloudFrontDistributionId:
    Description: Needed for cache invalidation after frontend redeploy
    Value: !Ref CloudFrontDistribution
  DBClusterEndpoint:
    Condition: ShouldCreateDb
    Description: Aurora writer endpoint — store as /amaradata/<env>/db-host in SSM Parameter Store
    Value: !GetAtt DBCluster.Endpoint.Address
  SesDomainIdentityArn:
    Description: SES domain identity ARN for amaradata.com — use as Resource in rohas and other tenant stack ses:SendEmail IAM policies
    Value: !Sub 'arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/amaradata.com'
  SesFromEmailOutput:
    Description: SES sender address in use — any @amaradata.com address is valid once the domain is verified
    Value: !Ref SesFromEmail
